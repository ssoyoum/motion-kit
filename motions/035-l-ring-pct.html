<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원형 퍼센트</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 원형 퍼센트 · 2.6s · @property 0→100 */
@property --mk-l-ring-pct-n { syntax: "<integer>"; initial-value: 0; inherits: true; }
.mk-l-ring-pct {
  position: relative; width: 64px; height: 64px; display: grid; place-items: center;
  font: 700 14px system-ui, sans-serif; font-variant-numeric: tabular-nums;
  counter-reset: mk-l-ring-pct var(--mk-l-ring-pct-n);
  animation: mk-l-ring-pct 2.6s cubic-bezier(.4, 0, .2, 1) infinite;
}
.mk-l-ring-pct::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--mk-accent, #2F5BFF) calc(var(--mk-l-ring-pct-n) * 1%), color-mix(in srgb, var(--mk-accent, #2F5BFF) 15%, transparent) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent 80%, #000 81%);
  mask: radial-gradient(farthest-side, transparent 80%, #000 81%);
}
.mk-l-ring-pct::after { content: counter(mk-l-ring-pct) "%"; }
@keyframes mk-l-ring-pct { 0% { --mk-l-ring-pct-n: 0; } 85%, 100% { --mk-l-ring-pct-n: 100; } }
</style>
</head>
<body>
<div class="mk-l-ring-pct"></div>
</body>
</html>
