<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이콘 회전</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 아이콘 회전 · 0.4s · 90° 튕김 회전 · 마우스를 올려 보세요 */
.mk-hb-icon {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; cursor: pointer;
  border: 1.5px solid var(--mk-ink, #1B1E26); border-radius: 999px; background: transparent;
  color: var(--mk-ink, #1B1E26); font: 700 14px system-ui, sans-serif;
  transition: background .25s, color .25s;
}
.mk-hb-icon svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
  transition: transform .4s cubic-bezier(.34, 1.56, .64, 1);
}
.mk-hb-icon:hover, .mk-hb-icon:focus-visible { background: var(--mk-ink, #1B1E26); color: var(--mk-on-ink, #fff); }
.mk-hb-icon:hover svg, .mk-hb-icon:focus-visible svg { transform: rotate(90deg); }
</style>
</head>
<body>
<button class="mk-hb-icon" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>담기</button>
</body>
</html>
