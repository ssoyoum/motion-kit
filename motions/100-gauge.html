<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게이지 바늘</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 게이지 바늘 · 3s · -90°→35° 튕김 */
.mk-gauge { position: relative; width: 100px; height: 50px; }
.mk-gauge::before {
  content: ""; position: absolute; inset: 0; border-radius: 50px 50px 0 0;
  background: conic-gradient(from -90deg at 50% 100%, var(--mk-success, #1F9D55) 0 60deg, var(--mk-warn, #D99A00) 0 120deg, var(--mk-danger, #E5484D) 0 180deg, transparent 0);
  -webkit-mask: radial-gradient(circle at 50% 100%, transparent 34px, #000 35px);
  mask: radial-gradient(circle at 50% 100%, transparent 34px, #000 35px);
}
.mk-gauge i { position: absolute; left: calc(50% - 2px); bottom: 0; width: 4px; height: 44px; border-radius: 2px; background: var(--mk-ink, #1B1E26); transform-origin: 50% 100%; animation: mk-gauge 3s infinite; }
@keyframes mk-gauge {
  0% { transform: rotate(-90deg); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }
  40%, 85% { transform: rotate(35deg); }
  100% { transform: rotate(-90deg); }
}
</style>
</head>
<body>
<div class="mk-gauge"><i></i></div>
</body>
</html>
