<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스위치 켜기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 스위치 켜기 · 2.4s · 20px 이동 + 배경색 */
.mk-toggle { position: relative; width: 44px; height: 24px; border-radius: 12px; background: var(--mk-skel-a, #E0E4EC); animation: mk-toggle-bg 2.4s infinite; }
.mk-toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3);
  animation: mk-toggle 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
}
@keyframes mk-toggle { 0%, 40%, 100% { transform: none; } 50%, 90% { transform: translateX(20px); } }
@keyframes mk-toggle-bg { 0%, 40%, 100% { background: var(--mk-skel-a, #E0E4EC); } 50%, 90% { background: var(--mk-success, #1F9D55); } }
</style>
</head>
<body>
<div class="mk-toggle" role="switch" aria-checked="true"></div>
</body>
</html>
