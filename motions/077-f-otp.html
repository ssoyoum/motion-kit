<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증번호 입력</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 인증번호 입력 · 4s · 칸당 0.5s · 입력 칸 강조 */
.mk-f-otp { display: flex; gap: 8px; }
.mk-f-otp span {
  width: 34px; height: 42px; display: grid; place-items: center; border-radius: 8px;
  border: 1.5px solid var(--mk-line, #DCE0EA); color: transparent; font: 700 18px system-ui, sans-serif;
  animation: mk-f-otp 4s infinite;
}
.mk-f-otp span:nth-child(2) { animation-delay: 0.5s; }
.mk-f-otp span:nth-child(3) { animation-delay: 1.0s; }
.mk-f-otp span:nth-child(4) { animation-delay: 1.5s; }
@keyframes mk-f-otp {
  0% { color: transparent; border-color: var(--mk-line, #DCE0EA); transform: none; }
  4% { border-color: var(--mk-accent, #2F5BFF); }
  10% { color: var(--mk-ink, #1B1E26); border-color: var(--mk-accent, #2F5BFF); transform: scale(1.08); }
  16%, 85% { color: var(--mk-ink, #1B1E26); border-color: var(--mk-line, #DCE0EA); transform: none; }
  100% { color: transparent; border-color: var(--mk-line, #DCE0EA); }
}
</style>
</head>
<body>
<div class="mk-f-otp"><span>4</span><span>8</span><span>2</span><span>7</span></div>
</body>
</html>
