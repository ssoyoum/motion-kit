<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>툴팁 팝</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 툴팁 팝 · 3s · scale 0.8→1 · 아래 꼭지점 기준 */
.mk-fb-tooltip { display: grid; justify-items: center; gap: 8px; }
.mk-fb-tooltip p {
  position: relative; margin: 0; padding: 6px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap;
  background: var(--mk-ink, #1B1E26); color: var(--mk-on-ink, #fff);
  transform-origin: 50% calc(100% + 6px); animation: mk-fb-tooltip 3s cubic-bezier(.34, 1.56, .64, 1) infinite;
}
.mk-fb-tooltip p::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--mk-ink, #1B1E26); }
.mk-fb-tooltip span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--mk-ink-soft, #8A90A0); color: var(--mk-ink-soft, #8A90A0); font: 700 13px system-ui, sans-serif; }
@keyframes mk-fb-tooltip { 0%, 15% { opacity: 0; transform: scale(.8); } 25%, 80% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: scale(.9); } }
</style>
</head>
<body>
<div class="mk-fb-tooltip"><p>3만원 이상 무료배송</p><span>?</span></div>
</body>
</html>
