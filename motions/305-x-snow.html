<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내리는 눈·비</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 내리는 눈·비 · 4~7s · linear · ∞ · 무작위 지연 */
.mk-x-snow { position: relative; overflow: hidden; width: 200px; height: 120px; border-radius: 12px; background: var(--mk-ink, #1B1E26); }
.mk-x-snow i { position: absolute; top: -8px; width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: .85; animation: mk-x-snow var(--t) linear var(--d) infinite; }
@keyframes mk-x-snow { 0% { transform: translate(0, 0); } 50% { transform: translate(8px, 70px); } 100% { transform: translate(-6px, 140px); } }
</style>
</head>
<body>
<div class="mk-x-snow"><i style="left:2%;--d:-0s;--t:4s;--s:2px"></i>
<i style="left:39%;--d:-5.3s;--t:5s;--s:3px"></i>
<i style="left:76%;--d:-3.6s;--t:6s;--s:4px"></i>
<i style="left:17%;--d:-1.9s;--t:7s;--s:2px"></i>
<i style="left:54%;--d:-0.2s;--t:4s;--s:3px"></i>
<i style="left:91%;--d:-5.5s;--t:5s;--s:4px"></i>
<i style="left:32%;--d:-3.8s;--t:6s;--s:2px"></i>
<i style="left:69%;--d:-2.1s;--t:7s;--s:3px"></i>
<i style="left:10%;--d:-0.4s;--t:4s;--s:4px"></i>
<i style="left:47%;--d:-5.7s;--t:5s;--s:2px"></i>
<i style="left:84%;--d:-4s;--t:6s;--s:3px"></i>
<i style="left:25%;--d:-2.3s;--t:7s;--s:4px"></i>
<i style="left:62%;--d:-0.6s;--t:4s;--s:2px"></i>
<i style="left:3%;--d:-5.9s;--t:5s;--s:3px"></i></div>
</body>
</html>
