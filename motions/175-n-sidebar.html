<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이드바 접기·펼치기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 사이드바 접기·펼치기 · 4s · 폭 44px↔110px */
.mk-n-sidebar { display: flex; width: 200px; height: 110px; overflow: hidden; border-radius: 10px; border: 1px solid var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); }
.mk-n-sidebar aside {
  flex: none; width: 44px; padding: 10px 0; overflow: hidden;
  background: var(--mk-ink, #1B1E26); color: var(--mk-on-ink, #fff);
  animation: mk-n-sidebar 4s cubic-bezier(.6, 0, .2, 1) infinite;
}
.mk-n-sidebar p { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; padding: 4px 15px; white-space: nowrap; font: 600 11px system-ui, sans-serif; }
.mk-n-sidebar i { flex: none; width: 14px; height: 14px; border-radius: 4px; background: color-mix(in srgb, var(--mk-on-ink, #fff) 60%, transparent); }
.mk-n-sidebar span { opacity: 0; animation: mk-n-sidebar-t 4s infinite; }
.mk-n-sidebar > div { flex: 1; margin: 10px; border-radius: 6px; background: repeating-linear-gradient(var(--mk-skel-a, #E0E4EC) 0 10px, transparent 10px 18px); }
@keyframes mk-n-sidebar { 0%, 25%, 90%, 100% { width: 44px; } 40%, 75% { width: 110px; } }
@keyframes mk-n-sidebar-t { 0%, 30%, 80%, 100% { opacity: 0; } 42%, 72% { opacity: 1; } }
</style>
</head>
<body>
<div class="mk-n-sidebar"><aside><p><i></i><span>대시보드</span></p><p><i></i><span>주문</span></p><p><i></i><span>설정</span></p></aside><div></div></div>
</body>
</html>
