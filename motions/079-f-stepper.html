<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단계 진행</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 단계 진행 · 4s · 1→2→3 · 연결선 채움 */
.mk-f-stepper { display: flex; align-items: center; }
.mk-f-stepper i {
  width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font: 700 12px system-ui, sans-serif; font-style: normal;
  border: 2px solid var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); color: var(--mk-ink-soft, #8A90A0);
}
.mk-f-stepper i:nth-of-type(1) { border-color: var(--mk-accent, #2F5BFF); background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); }
.mk-f-stepper i:nth-of-type(2) { animation: mk-f-stepper-2 4s infinite; }
.mk-f-stepper i:nth-of-type(3) { animation: mk-f-stepper-3 4s infinite; }
.mk-f-stepper b { width: 44px; height: 3px; background: linear-gradient(var(--mk-accent, #2F5BFF), var(--mk-accent, #2F5BFF)) no-repeat 0 0 / 0% 100%, var(--mk-line, #DCE0EA); }
.mk-f-stepper b:nth-of-type(1) { animation: mk-f-stepper-l1 4s ease-in-out infinite; }
.mk-f-stepper b:nth-of-type(2) { animation: mk-f-stepper-l2 4s ease-in-out infinite; }
@keyframes mk-f-stepper-2 {
  0%, 30%, 100% { border-color: var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); color: var(--mk-ink-soft, #8A90A0); }
  33%, 95% { border-color: var(--mk-accent, #2F5BFF); background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); }
}
@keyframes mk-f-stepper-3 {
  0%, 65%, 100% { border-color: var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); color: var(--mk-ink-soft, #8A90A0); }
  68%, 95% { border-color: var(--mk-accent, #2F5BFF); background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); }
}
@keyframes mk-f-stepper-l1 { 0%, 15%, 100% { background-size: 0% 100%, auto; } 30%, 95% { background-size: 100% 100%, auto; } }
@keyframes mk-f-stepper-l2 { 0%, 50%, 100% { background-size: 0% 100%, auto; } 65%, 95% { background-size: 100% 100%, auto; } }
</style>
</head>
<body>
<div class="mk-f-stepper"><i>1</i><b></b><i>2</i><b></b><i>3</i></div>
</body>
</html>
