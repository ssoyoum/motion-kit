<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤하면 줄어드는 헤더</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 스크롤하면 줄어드는 헤더 · scroll() · 처음 60px 동안 높이 56→34 · 안에서 스크롤해 보세요 */
.mk-sc-header { width: 200px; height: 130px; overflow-y: auto; border-radius: 12px; background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); scrollbar-width: thin; }
.mk-sc-header header { position: sticky; top: 0; display: flex; align-items: center; height: 56px; padding: 0 12px; background: var(--mk-ink, #1B1E26); color: var(--mk-on-ink, #fff); font: 800 18px system-ui, sans-serif; letter-spacing: .08em; }
.mk-sc-header p { margin: 12px; font: 600 11px system-ui, sans-serif; color: var(--mk-ink-soft, #8A90A0); }
.mk-sc-header span { display: block; height: 8px; margin: 0 12px 10px; border-radius: 4px; background: var(--mk-skel-a, #E0E4EC); }
@supports (animation-timeline: scroll()) {
  .mk-sc-header header { animation: mk-sc-header linear both; animation-timeline: scroll(nearest); animation-range: 0 60px; }
}
@keyframes mk-sc-header { from { height: 56px; font-size: 18px; } to { height: 34px; font-size: 13px; box-shadow: 0 4px 12px rgb(0 0 0 / .2); } }
</style>
</head>
<body>
<div class="mk-sc-header"><header>MOTION</header><p>↓ 안에서 스크롤해 보세요</p><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</body>
</html>
