<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라디오 선택 이동</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 라디오 선택 이동 · 3s · 선택점이 1s씩 이동 */
.mk-f-radio { display: grid; gap: 8px; font: 13px system-ui, sans-serif; }
.mk-f-radio p { margin: 0; display: flex; align-items: center; gap: 8px; }
.mk-f-radio i {
  position: relative; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--mk-line, #DCE0EA);
  animation: mk-f-radio-b 3s infinite;
}
.mk-f-radio i::after {
  content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--mk-accent, #2F5BFF);
  transform: scale(0); animation: mk-f-radio 3s cubic-bezier(.34, 1.56, .64, 1) infinite;
}
.mk-f-radio p:nth-child(2) i, .mk-f-radio p:nth-child(2) i::after { animation-delay: 1s; }
.mk-f-radio p:nth-child(3) i, .mk-f-radio p:nth-child(3) i::after { animation-delay: 2s; }
@keyframes mk-f-radio { 0%, 33.4%, 100% { transform: scale(0); } 5%, 30% { transform: scale(1); } }
@keyframes mk-f-radio-b { 0%, 33.4%, 100% { border-color: var(--mk-line, #DCE0EA); } 5%, 30% { border-color: var(--mk-accent, #2F5BFF); } }
</style>
</head>
<body>
<div class="mk-f-radio"><p><i></i>일반 배송</p><p><i></i>새벽 배송</p><p><i></i>매장 픽업</p></div>
</body>
</html>
