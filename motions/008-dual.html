<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이중 링</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 이중 링 · 1s · 안쪽 0.7s 역회전 */
.mk-dual { position: relative; width: 44px; height: 44px; }
.mk-dual::before, .mk-dual::after { content: ""; position: absolute; border-radius: 50%; border: 3px solid transparent; }
.mk-dual::before { inset: 0; border-top-color: var(--mk-accent, #2F5BFF); border-bottom-color: var(--mk-accent, #2F5BFF); animation: mk-dual 1s linear infinite; }
.mk-dual::after { inset: 9px; border-left-color: var(--mk-accent, #2F5BFF); border-right-color: var(--mk-accent, #2F5BFF); opacity: .5; animation: mk-dual .7s linear infinite reverse; }
@keyframes mk-dual { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="mk-dual"></div>
</body>
</html>
