<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤곽선 채우기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 윤곽선 채우기 · 3s · text-stroke + background-clip */
.mk-ofill {
  font: 900 32px system-ui, sans-serif; letter-spacing: .04em; color: transparent;
  -webkit-text-stroke: 1.5px var(--mk-accent, #2F5BFF);
  background: linear-gradient(var(--mk-accent, #2F5BFF), var(--mk-accent, #2F5BFF)) no-repeat 0 0 / 0% 100%;
  -webkit-background-clip: text; background-clip: text;
  animation: mk-ofill 3s ease-in-out infinite;
}
@keyframes mk-ofill { 0%, 10% { background-size: 0% 100%; } 50%, 70% { background-size: 100% 100%; } 100% { background-size: 0% 100%; } }
</style>
</head>
<body>
<span class="mk-ofill">FRESH</span>
</body>
</html>
