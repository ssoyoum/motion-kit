<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앞으로 기울기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 앞으로 기울기 · 0.25s · skewX -10° + 오른쪽 4px · 마우스를 올려 보세요 */
.mk-hv-skew { position: relative; padding: 10px 20px; border: 0; border-radius: 8px; cursor: pointer; background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 700 14px system-ui, sans-serif; box-shadow: inset 0 0 0 1px var(--mk-line, #DCE0EA); }
.mk-hv-skew { transition: transform .25s, background .25s, color .25s; }
.mk-hv-skew:hover, .mk-hv-skew:focus-visible { transform: translateX(4px) skewX(-10deg); background: var(--mk-ink, #1B1E26); color: var(--mk-on-ink, #fff); }
</style>
</head>
<body>
<button class="mk-hv-skew" type="button">바로가기 →</button>
</body>
</html>
