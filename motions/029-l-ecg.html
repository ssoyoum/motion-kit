<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심전도</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 심전도 · 1.6s · 선 30% 길이로 흐름 */
.mk-l-ecg { width: 160px; height: 54px; }
.mk-l-ecg polyline { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.mk-l-ecg-tr { stroke: color-mix(in srgb, var(--mk-danger, #E5484D) 15%, transparent); }
.mk-l-ecg-mv { stroke: var(--mk-danger, #E5484D); stroke-dasharray: 30 70; stroke-dashoffset: 100; animation: mk-l-ecg 1.6s linear infinite; }
@keyframes mk-l-ecg { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<svg class="mk-l-ecg" viewBox="0 0 120 40"><polyline class="mk-l-ecg-tr" pathLength="100" points="0,20 34,20 40,20 46,6 52,34 58,12 62,20 120,20"/><polyline class="mk-l-ecg-mv" pathLength="100" points="0,20 34,20 40,20 46,6 52,34 58,12 62,20 120,20"/></svg>
</body>
</html>
