<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단계 막대</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 단계 막대 · 3.2s · 4칸 0.4s씩 */
.mk-l-steps { display: flex; gap: 4px; width: 180px; }
.mk-l-steps i { position: relative; flex: 1; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 18%, transparent); }
.mk-l-steps i::after { content: ""; position: absolute; inset: 0; background: var(--mk-accent, #2F5BFF); transform: scaleX(0); transform-origin: left; animation: mk-l-steps 3.2s ease-out infinite; }
.mk-l-steps i:nth-child(2)::after { animation-delay: 0.4s; }
.mk-l-steps i:nth-child(3)::after { animation-delay: 0.8s; }
.mk-l-steps i:nth-child(4)::after { animation-delay: 1.2s; }
@keyframes mk-l-steps { 0% { transform: scaleX(0); opacity: 1; } 12%, 80% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
</style>
</head>
<body>
<div class="mk-l-steps"><i></i><i></i><i></i><i></i></div>
</body>
</html>
