<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편지 날아감</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 편지 날아감 · 2.8s · 곡선으로 날아가며 사라짐 */
.mk-il-mail { width: 190px; height: 105px; overflow: visible; }
.mk-il-mail .trail { fill: none; stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 2; stroke-dasharray: 4 6; opacity: .6; animation: mk-il-mail-trail 2.8s linear infinite; }
.mk-il-mail .env { animation: mk-il-mail 2.8s cubic-bezier(.45, 0, .55, 1) infinite; }
.mk-il-mail .env rect { fill: var(--mk-surface, #fff); stroke: var(--mk-accent, #2F5BFF); stroke-width: 2.5; }
.mk-il-mail .env path { fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 2.5; stroke-linejoin: round; }
@keyframes mk-il-mail {
  0% { transform: translate(30px, 90px) rotate(-12deg) scale(.7); opacity: 0; }
  15% { opacity: 1; }
  65% { transform: translate(140px, 42px) rotate(6deg) scale(1); opacity: 1; }
  85%, 100% { transform: translate(175px, 22px) rotate(10deg) scale(.8); opacity: 0; }
}
@keyframes mk-il-mail-trail { to { stroke-dashoffset: -40; } }
</style>
</head>
<body>
<svg class="mk-il-mail" viewBox="0 0 200 110">
  <path class="trail" d="M20 96C60 90 100 66 150 36"/>
  <g class="env"><rect x="-22" y="-15" width="44" height="30" rx="4"/><path d="M-22 -13l22 16 22-16"/></g>
</svg>
</body>
</html>
