<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어 순차 강조</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 단어 순차 강조 · 4s · 단어당 0.6s */
.mk-t-karaoke { margin: 0; font: 700 18px system-ui, sans-serif; }
.mk-t-karaoke span {
  color: var(--mk-ink-soft, #8A90A0);
  background: linear-gradient(color-mix(in srgb, var(--mk-accent, #2F5BFF) 22%, transparent), color-mix(in srgb, var(--mk-accent, #2F5BFF) 22%, transparent)) no-repeat 0 100% / 0% 30%;
  animation: mk-t-karaoke 4s infinite;
}
.mk-t-karaoke span:nth-child(2) { animation-delay: 0.6s; }
.mk-t-karaoke span:nth-child(3) { animation-delay: 1.2s; }
.mk-t-karaoke span:nth-child(4) { animation-delay: 1.8s; }
@keyframes mk-t-karaoke {
  0%, 8% { color: var(--mk-ink-soft, #8A90A0); background-size: 0% 30%; }
  15%, 70% { color: var(--mk-accent, #2F5BFF); background-size: 100% 30%; }
  80%, 100% { color: var(--mk-ink-soft, #8A90A0); background-size: 100% 30%; }
}
</style>
</head>
<body>
<p class="mk-t-karaoke"><span>지금</span> <span>주문하면</span> <span>내일</span> <span>도착</span></p>
</body>
</html>
