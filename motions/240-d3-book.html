<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책장 넘김</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 책장 넘김 · 3.6s · rotateY 0→-180° */
.mk-d3-book { position: relative; width: 160px; height: 100px; padding: 4px; border-radius: 6px; background: var(--mk-accent, #2F5BFF); perspective: 600px; }
.mk-d3-book i, .mk-d3-book b {
  position: absolute; top: 4px; bottom: 4px; width: calc(50% - 4px);
  background: var(--mk-surface, #fff) repeating-linear-gradient(transparent 0 10px, var(--mk-line, #DCE0EA) 10px 11px) 10px 14px / calc(100% - 20px) calc(100% - 24px) no-repeat;
}
.mk-d3-book i:first-child { left: 4px; border-radius: 4px 0 0 4px; box-shadow: inset -6px 0 8px -6px rgb(0 0 0 / .3); }
.mk-d3-book i:nth-child(2) { left: 50%; border-radius: 0 4px 4px 0; box-shadow: inset 6px 0 8px -6px rgb(0 0 0 / .3); }
.mk-d3-book b { left: 50%; border-radius: 0 4px 4px 0; transform-origin: left; animation: mk-d3-book 3.6s cubic-bezier(.6, 0, .4, 1) infinite; }
@keyframes mk-d3-book {
  0% { transform: rotateY(0); opacity: 0; }
  5%, 10% { transform: rotateY(0); opacity: 1; }
  55%, 80% { transform: rotateY(-180deg); opacity: 1; }
  90%, 100% { transform: rotateY(-180deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="mk-d3-book"><i></i><i></i><b></b></div>
</body>
</html>
