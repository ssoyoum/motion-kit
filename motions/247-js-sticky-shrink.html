<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>줄어드는 헤더</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 줄어드는 헤더 · scrollTop > 8px · 0.25s · 스크롤해 보세요 */
.mk-js-sticky-shrink {
  width: 200px; height: 124px; overflow-y: auto; border-radius: 10px;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); scrollbar-width: thin;
}
.mk-js-sticky-shrink header {
  position: sticky; top: 0; padding: 18px 12px; font: 700 15px system-ui, sans-serif;
  background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff);
  transition: padding .25s ease, font-size .25s ease, box-shadow .25s ease;
}
.mk-js-sticky-shrink.shrunk header { padding: 6px 12px; font-size: 12px; box-shadow: 0 4px 10px rgb(0 0 0 / .18); }
.mk-js-sticky-shrink p { margin: 0; padding: 9px 12px; font-size: 12px; border-bottom: 1px solid var(--mk-line, #DCE0EA); color: var(--mk-ink, #1B1E26); }
</style>
</head>
<body>
<div class="mk-js-sticky-shrink">
  <header>교동마을 산지직송</header>
  <p>애플망고 2kg</p><p>꿀수박 1통</p><p>제주 옥돔 3미</p><p>노지 감귤 5kg</p><p>한라봉 3kg</p>
</div>
<script>
document.querySelectorAll(".mk-js-sticky-shrink").forEach(function (root) {
root.addEventListener("scroll", function () {
  root.classList.toggle("shrunk", root.scrollTop > 8);
}, { passive: true });
});
</script>
</body>
</html>
