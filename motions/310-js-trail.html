<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마우스 꼬리</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 마우스 꼬리 · 점 16ms마다 · 0.7s 사라짐 · 마우스를 올려 보세요 */
.mk-js-trail {
  position: relative; width: 220px; height: 120px; overflow: hidden; display: grid; place-items: center;
  border-radius: 12px; background: var(--mk-ink, #1B1E26);
}
.mk-js-trail b { font: 600 12px system-ui, sans-serif; color: rgb(255 255 255 / .55); pointer-events: none; }
.mk-js-trail .p {
  position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; pointer-events: none;
  animation: mk-js-trail-fade .7s ease-out forwards;
}
@keyframes mk-js-trail-fade { to { transform: scale(.2); opacity: 0; } }
</style>
</head>
<body>
<div class="mk-js-trail"><b>마우스를 움직여 보세요</b></div>
<script>
document.querySelectorAll(".mk-js-trail").forEach(function (root) {
var colors = ["var(--mk-accent, #2F5BFF)", "var(--mk-danger, #E5484D)", "var(--mk-warn, #D99A00)", "var(--mk-success, #1F9D55)"];
var n = 0, last = 0, lastMove = 0, t = 0;
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function spawn(x, y) {
  var p = document.createElement("i");
  p.className = "p";
  p.style.left = x + "px"; p.style.top = y + "px";
  p.style.background = colors[n++ % colors.length];
  root.appendChild(p);
  p.addEventListener("animationend", function () { p.remove(); });
}
root.addEventListener("pointermove", function (e) {
  var now = performance.now();
  lastMove = now;
  if (now - last < 16) return;
  last = now;
  var r = root.getBoundingClientRect();
  spawn(e.clientX - r.left, e.clientY - r.top);
});
if (!reduce) {
  var timer = setInterval(function () {
    if (!root.isConnected) return clearInterval(timer);
    if (performance.now() - lastMove < 1500) return;
    t += 0.14;
    spawn(110 + 80 * Math.sin(t), 60 + 32 * Math.sin(2 * t));
  }, 45);
}
});
</script>
</body>
</html>
