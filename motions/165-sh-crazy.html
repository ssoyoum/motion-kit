<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정신없이 흔들기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 정신없이 흔들기 · 0.8s · 위치·회전·크기·투명도 무작위 */
.mk-sh-crazy { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 800 22px system-ui, sans-serif; animation: mk-sh-crazy .8s linear infinite; }
@keyframes mk-sh-crazy { 0% { transform: none; } 8.3% { transform: translate(7.8px, 8.4px) rotate(-21.5deg) scale(1); } 16.7% { transform: translate(8.1px, -7.2px) rotate(-6.5deg) scale(1); } 25% { transform: translate(2.4px, -5.4px) rotate(-19deg) scale(1.2); } 33.3% { transform: translate(-2.1px, -6.3px) rotate(-0.1deg) scale(0.9); } 41.7% { transform: translate(-7.9px, 4.5px) rotate(-9.9deg) scale(0.9); } 50% { transform: translate(-9.4px, 7.5px) rotate(-15.6deg) scale(1.1); } 58.3% { transform: translate(-1.6px, -6.3px) rotate(2.6deg) scale(0.9); } 66.7% { transform: translate(4.2px, 2.1px) rotate(-20.7deg) scale(0.9); } 75% { transform: translate(-2px, -9.2px) rotate(24.9deg) scale(0.9); } 83.3% { transform: translate(2.6px, 1.9px) rotate(20.3deg) scale(0.9); } 91.7% { transform: translate(-2.2px, -1.1px) rotate(-5.6deg) scale(1.1); } 100% { transform: none; } }
</style>
</head>
<body>
<div class="mk-sh-crazy">🎉</div>
</body>
</html>
