<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탭 밑줄 이동</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 탭 밑줄 이동 · 4.5s · 56px씩 이동 */
.mk-tabs { position: relative; display: grid; grid-template-columns: repeat(3, 56px); padding-bottom: 8px; text-align: center; font: 600 13px system-ui, sans-serif; }
.mk-tabs i { position: absolute; left: 0; bottom: 0; width: 56px; height: 3px; border-radius: 2px; background: var(--mk-accent, #2F5BFF); animation: mk-tabs 4.5s cubic-bezier(.6, 0, .2, 1) infinite; }
@keyframes mk-tabs { 0%, 25% { transform: none; } 33%, 58% { transform: translateX(56px); } 66%, 91% { transform: translateX(112px); } 100% { transform: none; } }
</style>
</head>
<body>
<div class="mk-tabs"><span>주문</span><span>배송</span><span>환불</span><i></i></div>
</body>
</html>
