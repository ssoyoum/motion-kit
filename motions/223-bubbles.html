<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떠오르는 방울</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 떠오르는 방울 · 방울 6개 · 3~5.5s */
.mk-bubbles { position: relative; overflow: hidden; width: 180px; height: 110px; border-radius: 12px; background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 12%, transparent); }
.mk-bubbles i { position: absolute; bottom: -20px; border-radius: 50%; background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 45%, transparent); animation: mk-bubbles linear infinite; }
.mk-bubbles i:nth-child(1) { left: 15%; width: 8px; height: 8px; animation-duration: 4s; animation-delay: 0s; }
.mk-bubbles i:nth-child(2) { left: 40%; width: 12px; height: 12px; animation-duration: 5s; animation-delay: -1.5s; }
.mk-bubbles i:nth-child(3) { left: 62%; width: 6px; height: 6px; animation-duration: 3.5s; animation-delay: -2.5s; }
.mk-bubbles i:nth-child(4) { left: 80%; width: 10px; height: 10px; animation-duration: 4.5s; animation-delay: -0.8s; }
.mk-bubbles i:nth-child(5) { left: 28%; width: 5px; height: 5px; animation-duration: 3s; animation-delay: -2s; }
.mk-bubbles i:nth-child(6) { left: 90%; width: 7px; height: 7px; animation-duration: 5.5s; animation-delay: -3s; }
@keyframes mk-bubbles { to { transform: translateY(-150px); opacity: 0; } }
</style>
</head>
<body>
<div class="mk-bubbles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
