<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물결 밑줄</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 물결 밑줄 · 1.2s · linear · 3주기 이동 */
.mk-t-wavyline { position: relative; display: inline-block; overflow: hidden; padding-bottom: 10px; font: 800 22px system-ui, sans-serif; }
.mk-t-wavyline svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 8px; fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 2; animation: mk-t-wavyline 1.2s linear infinite; }
@keyframes mk-t-wavyline { to { transform: translateX(-50%); } }
</style>
</head>
<body>
<span class="mk-t-wavyline">신선함 보장<svg viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4Q5 0 10 4T20 4T30 4T40 4T50 4T60 4T70 4T80 4T90 4T100 4T110 4T120 4"/></svg></span>
</body>
</html>
