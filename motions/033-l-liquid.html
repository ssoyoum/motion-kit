<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차오르는 물</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 차오르는 물 · 회전 3s + 차오름 4s */
.mk-l-liquid { position: relative; box-sizing: border-box; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--mk-accent, #2F5BFF); overflow: hidden; }
.mk-l-liquid i {
  position: absolute; left: -50%; top: 100%; width: 200%; height: 200%; border-radius: 40%;
  background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 70%, transparent);
  animation: mk-l-liquid-r 3s linear infinite, mk-l-liquid-f 4s ease-in-out infinite;
}
@keyframes mk-l-liquid-r { to { transform: rotate(360deg); } }
@keyframes mk-l-liquid-f { 0% { top: 100%; } 80%, 100% { top: 5%; } }
</style>
</head>
<body>
<div class="mk-l-liquid"><i></i></div>
</body>
</html>
