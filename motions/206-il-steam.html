<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김 나는 컵</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 김 나는 컵 · 김 3줄 2.4s · 0.4s씩 */
.mk-il-steam { width: 190px; height: 105px; overflow: visible; }
.mk-il-steam .st path { fill: none; stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 3; stroke-linecap: round; opacity: 0; animation: mk-il-steam 2.4s ease-in infinite; }
.mk-il-steam .st path:nth-child(2) { animation-delay: .4s; }
.mk-il-steam .st path:nth-child(3) { animation-delay: .8s; }
.mk-il-steam .cup { fill: var(--mk-accent, #2F5BFF); }
.mk-il-steam .hd { fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 5; }
.mk-il-steam .sc { fill: var(--mk-ink-soft, #8A90A0); opacity: .5; }
@keyframes mk-il-steam { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-12px); opacity: 0; } }
</style>
</head>
<body>
<svg class="mk-il-steam" viewBox="0 0 200 110">
  <g class="st"><path d="M84 44q-6-8 0-16t0-16"/>
<path d="M96 44q-6-8 0-16t0-16"/>
<path d="M108 44q-6-8 0-16t0-16"/></g>
  <path class="cup" d="M68 50h56v22a18 18 0 0 1-18 18h-20a18 18 0 0 1-18-18z"/>
  <path class="hd" d="M124 56h6a9 9 0 0 1 0 18h-6"/>
  <ellipse class="sc" cx="96" cy="94" rx="44" ry="6"/>
</svg>
</body>
</html>
