<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종이비행기 전송</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 종이비행기 전송 · 2.4s · 오른쪽 위로 날아갔다 다시 등장 */
.mk-ic-send { width: 44px; height: 44px; overflow: visible; }
.mk-ic-send .pl { fill: var(--mk-accent, #2F5BFF); animation: mk-ic-send 2.4s cubic-bezier(.5, 0, .7, .4) infinite; }
.mk-ic-send .tr { fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 10; stroke-dashoffset: 10; animation: mk-ic-send-tr 2.4s infinite; }
@keyframes mk-ic-send {
  0%, 30% { transform: none; opacity: 1; }
  50% { transform: translate(12px, -12px); opacity: 0; animation-timing-function: step-end; }
  51% { transform: translate(-10px, 10px); opacity: 0; animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
  70%, 100% { transform: none; opacity: 1; }
}
@keyframes mk-ic-send-tr { 0%, 30% { stroke-dashoffset: 10; opacity: 1; } 45% { stroke-dashoffset: 0; opacity: 1; } 55%, 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
</head>
<body>
<svg class="mk-ic-send" viewBox="0 0 24 24" aria-label="보내기"><path class="tr" d="M2 22l7-7"/><path class="pl" d="M3 11.5L21 3l-8.5 18-2.2-7.3z"/></svg>
</body>
</html>
