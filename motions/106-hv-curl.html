<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모서리 접힘</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 모서리 접힘 · 0.35s · 오른쪽 위가 종이처럼 접힘 · 마우스를 올려 보세요 */
.mk-hv-curl { position: relative; padding: 10px 20px; border: 0; border-radius: 8px; cursor: pointer; background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 700 14px system-ui, sans-serif; box-shadow: inset 0 0 0 1px var(--mk-line, #DCE0EA); }
.mk-hv-curl { border-radius: 0; }
.mk-hv-curl::before { content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0; background: linear-gradient(225deg, var(--mk-stage, #ECEEF4) 45%, var(--mk-ink-soft, #8A90A0) 50%, var(--mk-line, #DCE0EA) 56%, var(--mk-surface, #fff) 80%); box-shadow: -1px 1px 2px rgb(0 0 0 / .2); transition: width .35s, height .35s; }
.mk-hv-curl:hover::before, .mk-hv-curl:focus-visible::before { width: 22px; height: 22px; }
</style>
</head>
<body>
<button class="mk-hv-curl" type="button">쿠폰 받기</button>
</body>
</html>
