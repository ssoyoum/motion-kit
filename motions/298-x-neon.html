<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네온 숨쉬기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 네온 숨쉬기 · 2s · ease-in-out · alternate */
.mk-x-neon { padding: 10px 24px; border: 2px solid var(--mk-accent, #2F5BFF); border-radius: 10px; color: var(--mk-accent, #2F5BFF); font: 800 20px system-ui, sans-serif; letter-spacing: .12em; animation: mk-x-neon 2s ease-in-out infinite alternate; }
@keyframes mk-x-neon { from { box-shadow: 0 0 4px var(--mk-accent, #2F5BFF), inset 0 0 4px color-mix(in srgb, var(--mk-accent, #2F5BFF) 40%, transparent); text-shadow: 0 0 2px var(--mk-accent, #2F5BFF); } to { box-shadow: 0 0 18px var(--mk-accent, #2F5BFF), 0 0 36px color-mix(in srgb, var(--mk-accent, #2F5BFF) 60%, transparent), inset 0 0 12px color-mix(in srgb, var(--mk-accent, #2F5BFF) 50%, transparent); text-shadow: 0 0 10px var(--mk-accent, #2F5BFF); } }
</style>
</head>
<body>
<div class="mk-x-neon">LIVE</div>
</body>
</html>
