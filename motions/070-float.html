<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>둥실둥실</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 둥실둥실 · 2.4s · 10px · 그림자 연동 */
.mk-float { position: relative; width: 40px; height: 40px; }
.mk-float i { display: block; width: 40px; height: 40px; border-radius: 50%; background: var(--mk-accent, #2F5BFF); animation: mk-float 2.4s ease-in-out infinite; }
.mk-float::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -14px; height: 6px; border-radius: 50%; background: rgb(0 0 0 / .2); animation: mk-float-s 2.4s ease-in-out infinite; }
@keyframes mk-float { 50% { transform: translateY(-10px); } }
@keyframes mk-float-s { 50% { transform: scale(.7); opacity: .5; } }
</style>
</head>
<body>
<div class="mk-float"><i></i></div>
</body>
</html>
