<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첨부 파일 전송</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 첨부 파일 전송 · 3.5s · 진행 바 후 '전송됨' */
.mk-c-attach { display: flex; gap: 8px; align-items: center; width: 180px; padding: 8px 10px; border-radius: 14px 14px 4px 14px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font-size: 12px; }
.mk-c-attach svg { flex: none; width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.mk-c-attach div { display: grid; gap: 4px; flex: 1; min-width: 0; }
.mk-c-attach i { height: 4px; border-radius: 2px; background: linear-gradient(currentColor, currentColor) 0 0 / 0% 100% no-repeat, color-mix(in srgb, currentColor 30%, transparent); animation: mk-c-attach 3.5s ease-out infinite; }
.mk-c-attach small { grid-area: 2 / 1; opacity: 0; animation: mk-c-attach-d 3.5s infinite; }
.mk-c-attach i { grid-area: 2 / 1; align-self: center; }
@keyframes mk-c-attach { 0% { background-size: 0% 100%, auto; opacity: 1; } 60% { background-size: 100% 100%, auto; opacity: 1; } 66%, 100% { background-size: 100% 100%, auto; opacity: 0; } }
@keyframes mk-c-attach-d { 0%, 64% { opacity: 0; } 70%, 92% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-c-attach"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/></svg><div><b>영수증.pdf</b><i></i><small>전송됨 ✓</small></div></div>
</body>
</html>
