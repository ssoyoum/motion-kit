<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하단 정보 올라오기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 하단 정보 올라오기 · 0.35s · 정보 패널 translateY · 마우스를 올려 보세요 */
.mk-cd-slideup {
  position: relative; width: 150px; height: 110px; overflow: hidden; border-radius: 12px; cursor: pointer;
  background: linear-gradient(160deg, color-mix(in srgb, var(--mk-accent, #2F5BFF) 35%, #fff), var(--mk-accent, #2F5BFF));
}
.mk-cd-slideup div {
  position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 2px; padding: 8px 10px;
  background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 600 12px system-ui, sans-serif;
  transform: translateY(calc(100% - 30px)); transition: transform .35s cubic-bezier(.2, .8, .2, 1);
}
.mk-cd-slideup span { color: var(--mk-ink-soft, #8A90A0); font-weight: 500; }
.mk-cd-slideup:hover div, .mk-cd-slideup:focus-visible div { transform: none; }
</style>
</head>
<body>
<article class="mk-cd-slideup" tabindex="0"><div><b>갈치 1kg</b><span>38,000원 · 무료배송</span></div></article>
</body>
</html>
