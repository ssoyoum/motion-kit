<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검색창 펼치기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 검색창 펼치기 · 3s · 36px→170px */
.mk-search {
  box-sizing: border-box; display: flex; align-items: center; gap: 6px; width: 36px; height: 36px; padding: 0 9px;
  border: 2px solid var(--mk-ink, #1B1E26); border-radius: 18px; overflow: hidden;
  animation: mk-search 3s cubic-bezier(.6, 0, .2, 1) infinite;
}
.mk-search svg { flex: none; width: 14px; height: 14px; fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 2.5; stroke-linecap: round; }
.mk-search span { white-space: nowrap; font-size: 13px; color: var(--mk-ink-soft, #8A90A0); }
@keyframes mk-search { 0%, 20% { width: 36px; } 45%, 80% { width: 170px; } 100% { width: 36px; } }
</style>
</head>
<body>
<div class="mk-search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6"/></svg><span>상품 검색</span></div>
</body>
</html>
