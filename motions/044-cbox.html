<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체크박스</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 체크박스 · 2.4s · 채움 → 체크 */
.mk-cbox { width: 32px; height: 32px; }
.mk-cbox rect { fill: transparent; stroke: var(--mk-accent, #2F5BFF); stroke-width: 2; animation: mk-cbox-r 2.4s infinite; }
.mk-cbox path { fill: none; stroke: var(--mk-on-accent, #fff); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 15; stroke-dashoffset: 15; animation: mk-cbox-p 2.4s infinite; }
@keyframes mk-cbox-r { 0%, 15%, 100% { fill: transparent; } 25%, 90% { fill: var(--mk-accent, #2F5BFF); } }
@keyframes mk-cbox-p { 0%, 25% { stroke-dashoffset: 15; } 40%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 15; } }
</style>
</head>
<body>
<svg class="mk-cbox" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M7 12.5l3.5 3.5L17 9"/></svg>
</body>
</html>
