<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확대·회전 전환</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 확대·회전 전환 · 5s · scale 1.4 → 0.6, ±10° */
.mk-tr-zoomrot { position: relative; width: 130px; height: 80px; }
.mk-tr-zoomrot i {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 12px; opacity: 0;
  font: 800 14px/1 system-ui, sans-serif; font-style: normal; color: #fff;
  animation: mk-tr-zoomrot 5s cubic-bezier(.6, 0, .4, 1) infinite;
}
.mk-tr-zoomrot i:first-child { background: var(--mk-success, #1F9D55); }
.mk-tr-zoomrot i:last-child { background: var(--mk-danger, #E5484D); animation-delay: -2.5s; }
@keyframes mk-tr-zoomrot {
  0% { opacity: 0; transform: scale(1.4) rotate(10deg); }
  12%, 45% { opacity: 1; transform: none; }
  55%, 100% { opacity: 0; transform: scale(.6) rotate(-10deg); }
}
</style>
</head>
<body>
<div class="mk-tr-zoomrot"><i>봄 컬렉션</i><i>여름 컬렉션</i></div>
</body>
</html>
