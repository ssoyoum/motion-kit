<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상단 성공 배너</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 상단 성공 배너 · 3.5s · 위에서 내려왔다 올라감 */
.mk-fb-banner { position: relative; overflow: hidden; width: 190px; height: 100px; border-radius: 12px; background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); }
.mk-fb-banner i { position: absolute; left: 12px; height: 8px; border-radius: 4px; background: var(--mk-skel-a, #E0E4EC); }
.mk-fb-banner i:nth-of-type(1) { top: 56px; width: 70%; }
.mk-fb-banner i:nth-of-type(2) { top: 72px; width: 45%; }
.mk-fb-banner p {
  position: absolute; left: 8px; right: 8px; top: 8px; margin: 0; padding: 8px 10px; border-radius: 8px;
  background: var(--mk-success, #1F9D55); color: #fff; font-size: 12px; font-weight: 600;
  animation: mk-fb-banner 3.5s cubic-bezier(.2, .8, .2, 1) infinite;
}
@keyframes mk-fb-banner { 0% { transform: translateY(-140%); } 12%, 80% { transform: none; } 100% { transform: translateY(-140%); } }
</style>
</head>
<body>
<div class="mk-fb-banner"><p>✓ 주문이 접수됐어요</p><i></i><i></i></div>
</body>
</html>
