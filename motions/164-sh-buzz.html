<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휴대폰 진동</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 휴대폰 진동 · 1.6s · 0.4s 떨고 쉬기 반복 */
.mk-sh-buzz { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 800 22px system-ui, sans-serif; animation: mk-sh-buzz 1.6s linear infinite; }
@keyframes mk-sh-buzz { 0% { transform: none; } 3% { transform: translateX(3px) rotate(4deg); } 6% { transform: none; } 9% { transform: translateX(-3px) rotate(-4deg); } 12% { transform: none; } 15% { transform: translateX(3px) rotate(4deg); } 18% { transform: none; } 21% { transform: translateX(-3px) rotate(-4deg); } 24% { transform: none; } 25%, 100% { transform: none; } }
</style>
</head>
<body>
<div class="mk-sh-buzz">☎</div>
</body>
</html>
