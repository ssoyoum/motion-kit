<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보이면 올라가는 숫자</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 보이면 올라가는 숫자 · IntersectionObserver · 1.6s easeOutCubic · 4s마다 다시 */
.mk-js-countup { display: grid; justify-items: center; gap: 2px; }
.mk-js-countup b { font: 800 34px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--mk-ink, #1B1E26); }
.mk-js-countup small { font-size: 12px; color: var(--mk-ink-soft, #8A90A0); }
</style>
</head>
<body>
<div class="mk-js-countup"><b data-to="12480">0</b><small>누적 주문</small></div>
<script>
document.querySelectorAll(".mk-js-countup").forEach(function (root) {
var b = root.querySelector("b"), to = +b.dataset.to, visible = false;
function run() {
  var t0 = performance.now(), d = 1600;
  (function f(t) {
    var p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3);
    b.textContent = Math.round(to * e).toLocaleString("ko-KR");
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}
if (matchMedia("(prefers-reduced-motion: reduce)").matches) { b.textContent = to.toLocaleString("ko-KR"); return; }
new IntersectionObserver(function (es) {
  var was = visible; visible = es[0].isIntersecting;
  if (visible && !was) run();
}, { threshold: 0.6 }).observe(root);
var timer = setInterval(function () {
  if (!root.isConnected) return clearInterval(timer);
  if (visible) run();
}, 4000);
});
</script>
</body>
</html>
