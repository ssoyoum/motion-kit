<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세로 뉴스 롤링</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 세로 뉴스 롤링 · 6s · 4줄 + 첫 줄 복제 */
.mk-t-ticker { display: flex; align-items: center; gap: 8px; width: 200px; font-size: 13px; }
.mk-t-ticker b { flex: none; padding: 2px 6px; border-radius: 4px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font-size: 11px; }
.mk-t-ticker div { height: 1.5em; overflow: hidden; }
.mk-t-ticker ul { margin: 0; padding: 0; list-style: none; animation: mk-t-ticker 6s cubic-bezier(.7, 0, .3, 1) infinite; }
.mk-t-ticker li { height: 1.5em; line-height: 1.5em; white-space: nowrap; }
@keyframes mk-t-ticker {
  0%, 18% { transform: none; }
  25%, 43% { transform: translateY(-20%); }
  50%, 68% { transform: translateY(-40%); }
  75%, 93% { transform: translateY(-60%); }
  100% { transform: translateY(-80%); }
}
</style>
</head>
<body>
<div class="mk-t-ticker"><b>공지</b><div><ul><li>추석 배송 마감 9/24</li><li>애플망고 예약 시작</li><li>신규 회원 5% 쿠폰</li><li>제주 직송 무료배송</li><li aria-hidden="true">추석 배송 마감 9/24</li></ul></div></div>
</body>
</html>
