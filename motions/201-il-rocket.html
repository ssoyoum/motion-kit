<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로켓 발사</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 로켓 발사 · 불꽃 0.15s 깜빡 · 몸체 1.2s 둥실 · 속도선 */
.mk-il-rocket { width: 190px; height: 105px; overflow: visible; }
.mk-il-rocket .lines line { stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 2.5; stroke-linecap: round; animation: mk-il-rocket-line .8s linear infinite; }
.mk-il-rocket .lines line:nth-child(2) { animation-delay: 0.2s; }
.mk-il-rocket .lines line:nth-child(3) { animation-delay: 0.4s; }
.mk-il-rocket .lines line:nth-child(4) { animation-delay: 0.6s; }
.mk-il-rocket .ship { animation: mk-il-rocket-float 1.2s ease-in-out infinite alternate; }
.mk-il-rocket .flame { fill: var(--mk-warn, #D99A00); transform-box: fill-box; transform-origin: top center; animation: mk-il-rocket-flame .15s ease-in-out infinite alternate; }
.mk-il-rocket .fin { fill: var(--mk-danger, #E5484D); }
.mk-il-rocket .hull { fill: var(--mk-surface, #fff); stroke: var(--mk-ink, #1B1E26); stroke-width: 2.5; stroke-linejoin: round; }
.mk-il-rocket .win { fill: var(--mk-accent, #2F5BFF); stroke: var(--mk-ink, #1B1E26); stroke-width: 2.5; }
@keyframes mk-il-rocket-line { from { transform: translateY(-10px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(30px); opacity: 0; } }
@keyframes mk-il-rocket-float { from { transform: translateY(2px); } to { transform: translateY(-4px); } }
@keyframes mk-il-rocket-flame { from { transform: scaleY(.7); } to { transform: scaleY(1.15); } }
</style>
</head>
<body>
<svg class="mk-il-rocket" viewBox="0 0 200 110">
  <g class="lines"><line x1="64" y1="18" x2="64" y2="34"/>
<line x1="78" y1="40" x2="78" y2="56"/>
<line x1="122" y1="30" x2="122" y2="46"/>
<line x1="136" y1="50" x2="136" y2="66"/></g>
  <g class="ship">
    <path class="flame" d="M92 80h16l-8 22z"/>
    <path class="fin" d="M88 60l-11 18h12zM112 60l11 18h-12z"/>
    <path class="hull" d="M100 12c12 10 14 30 12 68H88c-2-38 0-58 12-68z"/>
    <circle class="win" cx="100" cy="42" r="7"/>
  </g>
</svg>
</body>
</html>
