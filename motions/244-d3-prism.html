<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼각기둥 회전</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 삼각기둥 회전 · 6s · 120°씩 멈춤 회전 */
.mk-d3-prism { width: 60px; height: 70px; perspective: 400px; }
.mk-d3-prism > div { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: mk-d3-prism 6s cubic-bezier(.6, 0, .4, 1) infinite; }
.mk-d3-prism i {
  position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden;
  font: 800 13px/1 system-ui, sans-serif; font-style: normal; color: #fff;
}
.mk-d3-prism i:nth-child(1) { transform: rotateY(0deg) translateZ(17.3px); background: var(--mk-accent, #2F5BFF); }
.mk-d3-prism i:nth-child(2) { transform: rotateY(120deg) translateZ(17.3px); background: var(--mk-success, #1F9D55); }
.mk-d3-prism i:nth-child(3) { transform: rotateY(240deg) translateZ(17.3px); background: var(--mk-danger, #E5484D); }
@keyframes mk-d3-prism {
  0%, 25% { transform: rotateY(0); }
  33%, 58% { transform: rotateY(-120deg); }
  66%, 91% { transform: rotateY(-240deg); }
  100% { transform: rotateY(-360deg); }
}
</style>
</head>
<body>
<div class="mk-d3-prism"><div><i>기획</i><i>개발</i><i>배포</i></div></div>
</body>
</html>
