<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도는 테두리 빛</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 도는 테두리 빛 · 3s · linear · ∞ · conic-gradient */
@property --mk-x-beam-a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
.mk-x-beam { padding: 2px; border-radius: 14px; background: conic-gradient(from var(--mk-x-beam-a), transparent 0 70%, var(--mk-accent, #2F5BFF) 90%, transparent); animation: mk-x-beam 3s linear infinite; }
.mk-x-beam span { display: grid; place-items: center; width: 150px; height: 80px; border-radius: 12px; background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 700 14px system-ui, sans-serif; }
@keyframes mk-x-beam { to { --mk-x-beam-a: 360deg; } }
</style>
</head>
<body>
<div class="mk-x-beam"><span>Pro 요금제</span></div>
</body>
</html>
