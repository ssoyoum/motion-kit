<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후기 돌려 보이기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 후기 돌려 보이기 · 9s · 후기 3개 3s씩 */
.mk-t-quote { display: grid; width: 200px; }
.mk-t-quote p { grid-area: 1 / 1; margin: 0; font-size: 14px; opacity: 0; animation: mk-t-quote 9s infinite; }
.mk-t-quote b { display: block; color: var(--mk-warn, #D99A00); letter-spacing: .1em; font-size: 12px; }
.mk-t-quote p:nth-child(2) { animation-delay: 3s; }
.mk-t-quote p:nth-child(3) { animation-delay: 6s; }
@keyframes mk-t-quote { 0% { opacity: 0; transform: translateY(8px); } 5%, 30% { opacity: 1; transform: none; } 36%, 100% { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>
<div class="mk-t-quote"><p><b>★★★★★</b> 당도가 정말 높아요</p><p><b>★★★★★</b> 포장이 꼼꼼해요</p><p><b>★★★★☆</b> 배송이 하루 만에 왔어요</p></div>
</body>
</html>
