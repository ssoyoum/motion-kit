<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보내기 버튼 활성</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 보내기 버튼 활성 · 3.5s · 입력 steps(7) 후 버튼 켜짐 */
.mk-c-sendbtn { display: flex; align-items: center; gap: 8px; width: 190px; padding: 5px 5px 5px 12px; border-radius: 20px; border: 1px solid var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); }
.mk-c-sendbtn span { flex: 1; overflow: hidden; white-space: nowrap; font-size: 13px; line-height: 1; }
.mk-c-sendbtn span { max-width: 7em; animation: mk-c-sendbtn-t 3.5s steps(7) infinite; }
.mk-c-sendbtn b { margin-left: auto; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--mk-skel-a, #E0E4EC); animation: mk-c-sendbtn-b 3.5s infinite; }
.mk-c-sendbtn svg { width: 15px; height: 15px; fill: #fff; }
@keyframes mk-c-sendbtn-t { 0%, 10% { max-width: 0; } 50%, 85% { max-width: 7em; } 100% { max-width: 0; } }
@keyframes mk-c-sendbtn-b {
  0%, 48% { background: var(--mk-skel-a, #E0E4EC); transform: none; }
  53% { background: var(--mk-accent, #2F5BFF); transform: scale(1.15); }
  58%, 85% { background: var(--mk-accent, #2F5BFF); transform: none; }
  100% { background: var(--mk-skel-a, #E0E4EC); }
}
</style>
</head>
<body>
<div class="mk-c-sendbtn"><span>주문취소할게요</span><b><svg viewBox="0 0 24 24" aria-label="보내기"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg></b></div>
</body>
</html>
