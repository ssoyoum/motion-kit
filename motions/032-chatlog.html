<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대화 쌓이기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 대화 쌓이기 · 4.5s · 말풍선당 0.6s */
.mk-chat { display: grid; gap: 6px; width: 190px; font-size: 12.5px; }
.mk-chat p { margin: 0; padding: 6px 10px; border-radius: 12px; justify-self: start; background: var(--mk-bubble, #E3E7F0); opacity: 0; animation: mk-chat 4.5s infinite; }
.mk-chat p:nth-child(2) { justify-self: end; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); animation-delay: .6s; }
.mk-chat p:nth-child(3) { animation-delay: 1.2s; }
@keyframes mk-chat { 0% { opacity: 0; transform: translateY(8px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-chat"><p>배송 언제 와요?</p><p>내일 도착해요</p><p>감사합니다</p></div>
</body>
</html>
