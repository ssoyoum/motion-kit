<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 버튼 3단계</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 결제 버튼 3단계 · 4s · 25% / 65% 전환 */
.mk-btnload {
  display: inline-grid; place-items: center; min-width: 120px; height: 40px; border: 0; border-radius: 10px;
  background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 700 14px system-ui, sans-serif;
  animation: mk-bl-bg 4s infinite;
}
.mk-btnload > * { grid-area: 1 / 1; }
.mk-btnload span { animation: mk-bl-t 4s infinite; }
.mk-btnload i {
  width: 18px; height: 18px; border-radius: 50%; opacity: 0;
  border: 2.5px solid color-mix(in srgb, currentColor 35%, transparent); border-top-color: currentColor;
  animation: mk-bl-s 4s infinite, mk-bl-rot .8s linear infinite;
}
.mk-btnload b { font-size: 18px; opacity: 0; animation: mk-bl-c 4s infinite; }
@keyframes mk-bl-bg { 0%, 62% { background: var(--mk-accent, #2F5BFF); } 68%, 95% { background: var(--mk-success, #1F9D55); } }
@keyframes mk-bl-t { 0%, 20% { opacity: 1; } 25%, 95% { opacity: 0; } 100% { opacity: 1; } }
@keyframes mk-bl-s { 0%, 22% { opacity: 0; } 27%, 60% { opacity: 1; } 65%, 100% { opacity: 0; } }
@keyframes mk-bl-c { 0%, 63% { opacity: 0; transform: scale(.4); } 70%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes mk-bl-rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<button class="mk-btnload" type="button"><span>결제하기</span><i></i><b>✓</b></button>
</body>
</html>
