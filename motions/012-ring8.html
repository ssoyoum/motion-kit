<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점 고리</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 점 고리 · 1s · 점 8개 · 0.125s씩 */
.mk-ring8 { position: relative; width: 44px; height: 44px; }
.mk-ring8 i {
  position: absolute; left: 18px; top: 0; width: 8px; height: 8px; border-radius: 50%;
  background: var(--mk-accent, #2F5BFF); transform-origin: 4px 22px; animation: mk-ring8 1s ease-in-out infinite;
}
.mk-ring8 i:nth-child(1) { transform: rotate(0deg); animation-delay: -1.000s; }
.mk-ring8 i:nth-child(2) { transform: rotate(45deg); animation-delay: -0.875s; }
.mk-ring8 i:nth-child(3) { transform: rotate(90deg); animation-delay: -0.750s; }
.mk-ring8 i:nth-child(4) { transform: rotate(135deg); animation-delay: -0.625s; }
.mk-ring8 i:nth-child(5) { transform: rotate(180deg); animation-delay: -0.500s; }
.mk-ring8 i:nth-child(6) { transform: rotate(225deg); animation-delay: -0.375s; }
.mk-ring8 i:nth-child(7) { transform: rotate(270deg); animation-delay: -0.250s; }
.mk-ring8 i:nth-child(8) { transform: rotate(315deg); animation-delay: -0.125s; }
@keyframes mk-ring8 { 0%, 100% { opacity: .2; scale: .6; } 50% { opacity: 1; scale: 1; } }
</style>
</head>
<body>
<div class="mk-ring8"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
