<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작아지며 위로</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 작아지며 위로 · 3s · 살짝 내려앉았다 위로 빨려 들어감 */
.mk-ex-zoom-up { width: 140px; padding: 12px 14px; border-radius: 12px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 700 13px system-ui, sans-serif; text-align: center; animation: mk-ex-zoom-up 3s cubic-bezier(.5, 0, .75, 0) infinite; }
@keyframes mk-ex-zoom-up { 0%, 20% { transform: none; opacity: 1; } 34% { transform: translateY(10px) scale(.6); opacity: 1; } 58% { transform: translateY(-120px) scale(.1); opacity: 0; } 80% { transform: none; opacity: 0; } 100% { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="mk-ex-zoom-up">읽음 처리</div>
</body>
</html>
