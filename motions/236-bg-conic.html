<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회전 원뿔 그라데이션</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 회전 원뿔 그라데이션 · 8s · linear · 4색 conic */
.mk-bg-conic { position: relative; width: 180px; height: 110px; border-radius: 12px; overflow: hidden; }
.mk-bg-conic::before {
  content: ""; position: absolute; inset: -60%;
  background: conic-gradient(from 0deg, var(--mk-accent, #2F5BFF), var(--mk-success, #1F9D55), var(--mk-warn, #D99A00), var(--mk-danger, #E5484D), var(--mk-accent, #2F5BFF));
  animation: mk-bg-conic 8s linear infinite;
}
.mk-bg-conic::after { content: ""; position: absolute; inset: 0; background: rgb(255 255 255 / .22); }
@keyframes mk-bg-conic { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="mk-bg-conic"></div>
</body>
</html>
