<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떨어지는 글자</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 떨어지는 글자 · 3s · 글자당 0.08s · 착지 튕김 */
.mk-t-dropletters { margin: 0; padding-top: 20px; font: 800 24px system-ui, sans-serif; color: var(--mk-danger, #E5484D); }
.mk-t-dropletters span { display: inline-block; animation: mk-t-dropletters 3s infinite; }
.mk-t-dropletters span:nth-child(2) { animation-delay: 0.08s; }
.mk-t-dropletters span:nth-child(3) { animation-delay: 0.16s; }
.mk-t-dropletters span:nth-child(4) { animation-delay: 0.24s; }
.mk-t-dropletters span:nth-child(5) { animation-delay: 0.32s; }
.mk-t-dropletters span:nth-child(6) { animation-delay: 0.40s; }
@keyframes mk-t-dropletters {
  0% { transform: translateY(-40px); opacity: 0; animation-timing-function: cubic-bezier(.5, 0, 1, .5); }
  15% { transform: translateY(4px); opacity: 1; }
  20%, 80% { transform: none; opacity: 1; }
  100% { transform: translateY(10px); opacity: 0; }
}
</style>
</head>
<body>
<p class="mk-t-dropletters"><span>오</span><span>픈</span><span>&nbsp;</span><span>특</span><span>가</span><span>!</span></p>
</body>
</html>
