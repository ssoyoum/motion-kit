<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메시지 삭제</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 메시지 삭제 · 3.5s · 줄어들며 사라짐 → 안내 문구 */
.mk-c-delete { display: grid; justify-items: end; width: 180px; }
.mk-c-delete p, .mk-c-delete em { grid-area: 1 / 1; margin: 0; font-size: 13px; }
.mk-c-delete p { padding: 8px 12px; border-radius: 14px 14px 4px 14px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); transform-origin: right center; animation: mk-c-delete 3.5s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-c-delete em { align-self: center; padding: 8px 12px; color: var(--mk-ink-soft, #8A90A0); animation: mk-c-delete-e 3.5s infinite; }
@keyframes mk-c-delete { 0%, 30% { transform: none; opacity: 1; } 45%, 90% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes mk-c-delete-e { 0%, 40% { opacity: 0; } 50%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-c-delete"><p>주소를 잘못 보냈어요</p><em>삭제된 메시지입니다</em></div>
</body>
</html>
