<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입력 중 말풍선</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 입력 중 말풍선 · 1.2s · 지연 0.15s씩 */
.mk-typing {
  display: inline-flex; gap: 4px; padding: 12px 14px;
  border-radius: 18px 18px 18px 4px; background: var(--mk-bubble, #E3E7F0);
}
.mk-typing i {
  width: 7px; height: 7px; border-radius: 50%; background: var(--mk-ink-soft, #8A90A0);
  animation: mk-typing 1.2s infinite;
}
.mk-typing i:nth-child(2) { animation-delay: .15s; }
.mk-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes mk-typing {
  0%, 60%, 100% { transform: none; opacity: .4; }
  30% { transform: translateY(-4px); opacity: 1; }
}
</style>
</head>
<body>
<div class="mk-typing" aria-label="입력 중"><i></i><i></i><i></i></div>
</body>
</html>
