<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세게 흔들기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 세게 흔들기 · 0.4s · 무작위 ±8px · ±8° */
.mk-sh-hard { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 800 22px system-ui, sans-serif; animation: mk-sh-hard .4s linear infinite; background: var(--mk-danger, #E5484D); }
@keyframes mk-sh-hard { 0% { transform: none; } 10% { transform: translate(-0.2px, 1px) rotate(-6.2deg); } 20% { transform: translate(-4.1px, -0.9px) rotate(0.1deg); } 30% { transform: translate(-6.7px, 6.1px) rotate(1.4deg); } 40% { transform: translate(-1.4px, -3.4px) rotate(4.5deg); } 50% { transform: translate(2.5px, -6.8px) rotate(0deg); } 60% { transform: translate(-4.2px, 2.8px) rotate(-5.5deg); } 70% { transform: translate(1px, -0.2px) rotate(-5.2deg); } 80% { transform: translate(-7.2px, 7px) rotate(7.5deg); } 90% { transform: translate(-6.1px, -0.9px) rotate(7.3deg); } 100% { transform: none; } }
</style>
</head>
<body>
<div class="mk-sh-hard">✕</div>
</body>
</html>
