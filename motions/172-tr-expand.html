<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드가 상세로 확장</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 카드가 상세로 확장 · 4s · 56px 카드 → 전체 영역 */
.mk-tr-expand { position: relative; width: 190px; height: 110px; border-radius: 12px; background: var(--mk-skel-a, #E0E4EC); }
.mk-tr-expand > div {
  position: absolute; left: 10px; top: 10px; width: 56px; height: 56px; border-radius: 10px; overflow: hidden;
  background: var(--mk-surface, #fff); box-shadow: 0 4px 14px rgb(0 0 0 / .15);
  animation: mk-tr-expand 4s cubic-bezier(.6, 0, .2, 1) infinite;
}
.mk-tr-expand i { display: block; height: 56px; background: var(--mk-accent, #2F5BFF); }
.mk-tr-expand span { display: block; height: 8px; margin: 8px 10px 0; border-radius: 4px; background: var(--mk-skel-a, #E0E4EC); opacity: 0; animation: mk-tr-expand-t 4s infinite; }
.mk-tr-expand span:last-child { width: 50%; }
@keyframes mk-tr-expand {
  0%, 20%, 100% { left: 10px; top: 10px; width: 56px; height: 56px; border-radius: 10px; }
  45%, 80% { left: 0; top: 0; width: 190px; height: 110px; border-radius: 12px; }
}
@keyframes mk-tr-expand-t { 0%, 42% { opacity: 0; } 50%, 76% { opacity: 1; } 84%, 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-tr-expand"><div><i></i><span></span><span></span></div></div>
</body>
</html>
