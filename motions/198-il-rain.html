<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비구름</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 비구름 · 빗방울 0.9s · 0.18s씩 · 구름 3s 흔들림 */
.mk-il-rain { width: 190px; height: 105px; }
.mk-il-rain .cloud { fill: var(--mk-ink-soft, #8A90A0); animation: mk-il-rain-cloud 3s ease-in-out infinite alternate; }
.mk-il-rain .drops path { stroke: var(--mk-accent, #2F5BFF); stroke-width: 3; stroke-linecap: round; animation: mk-il-rain-drop .9s linear infinite; }
.mk-il-rain .drops path:nth-child(1) { animation-delay: 0.00s; }
.mk-il-rain .drops path:nth-child(2) { animation-delay: 0.54s; }
.mk-il-rain .drops path:nth-child(3) { animation-delay: 0.18s; }
.mk-il-rain .drops path:nth-child(4) { animation-delay: 0.72s; }
.mk-il-rain .drops path:nth-child(5) { animation-delay: 0.36s; }
@keyframes mk-il-rain-cloud { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
@keyframes mk-il-rain-drop { from { transform: translateY(0); opacity: 1; } to { transform: translateY(32px); opacity: 0; } }
</style>
</head>
<body>
<svg class="mk-il-rain" viewBox="0 0 200 110">
  <g class="cloud"><circle cx="80" cy="40" r="18"/><circle cx="104" cy="32" r="22"/><circle cx="126" cy="42" r="16"/><rect x="62" y="40" width="80" height="18" rx="9"/></g>
  <g class="drops"><path d="M72 66l-3 9"/>
<path d="M86 66l-3 9"/>
<path d="M100 66l-3 9"/>
<path d="M114 66l-3 9"/>
<path d="M128 66l-3 9"/></g>
</svg>
</body>
</html>
