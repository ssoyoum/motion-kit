<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>육각 펄스</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 육각 펄스 · 1.8s · 육각 3겹 0.6s씩 */
.mk-l-hex { position: relative; width: 48px; height: 54px; }
.mk-l-hex i, .mk-l-hex::after { clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--mk-accent, #2F5BFF); }
.mk-l-hex i { position: absolute; inset: 0; animation: mk-l-hex 1.8s ease-out infinite; }
.mk-l-hex i:nth-child(2) { animation-delay: .6s; }
.mk-l-hex i:nth-child(3) { animation-delay: 1.2s; }
.mk-l-hex::after { content: ""; position: absolute; inset: 32%; }
@keyframes mk-l-hex { 0% { transform: scale(.25); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
</style>
</head>
<body>
<div class="mk-l-hex"><i></i><i></i><i></i></div>
</body>
</html>
