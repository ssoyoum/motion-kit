<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별점 채우기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 별점 채우기 · 3s · 별당 0.15s */
.mk-stars { display: flex; gap: 2px; font-size: 26px; line-height: 1; }
.mk-stars i { font-style: normal; color: var(--mk-skel-a, #E0E4EC); animation: mk-stars 3s infinite; }
.mk-stars i:nth-child(2) { animation-delay: 0.15s; }
.mk-stars i:nth-child(3) { animation-delay: 0.30s; }
.mk-stars i:nth-child(4) { animation-delay: 0.45s; }
.mk-stars i:nth-child(5) { animation-delay: 0.60s; }
@keyframes mk-stars {
  0%, 5% { color: var(--mk-skel-a, #E0E4EC); transform: none; }
  12% { transform: scale(1.3); }
  18%, 85% { color: var(--mk-warn, #D99A00); transform: none; }
  100% { color: var(--mk-skel-a, #E0E4EC); }
}
</style>
</head>
<body>
<div class="mk-stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div>
</body>
</html>
