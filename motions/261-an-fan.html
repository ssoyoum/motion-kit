<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팬 차트 예측 구간</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 팬 차트 예측 구간 · 4s · 실적 선 그린 뒤 구간 3겹 펼침 */
.mk-an-fan { width: 200px; height: 112px; overflow: visible; }
.mk-an-fan .ax { stroke: var(--mk-skel-a, #E0E4EC); }
.mk-an-fan text { font: 500 9px system-ui, sans-serif; fill: var(--mk-ink-soft, #8A90A0); }
.mk-an-fan polyline { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; animation: mk-an-fan-l 4s ease-out infinite both; }
.mk-an-fan g { transform-box: view-box; transform-origin: 120px 40px; animation: mk-an-fan-g 4s cubic-bezier(.2, .8, .2, 1) infinite both; }
.mk-an-fan polygon { fill: var(--mk-accent, #2F5BFF); opacity: .2; }
.mk-an-fan .fc { fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 1.5; stroke-dasharray: 3 2; animation: mk-an-fan-f 4s infinite both; }
@keyframes mk-an-fan-l { 0% { stroke-dashoffset: 1; opacity: 1; } 35%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes mk-an-fan-g { 0%, 35% { transform: scale(0); opacity: 1; } 60%, 90% { transform: none; opacity: 1; } 100% { transform: none; opacity: 0; } }
@keyframes mk-an-fan-f { 0%, 38% { opacity: 0; } 50%, 90% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<svg class="mk-an-fan" viewBox="0 0 180 100"><path class="ax" d="M8 92H176"/><g><polygon points="120,40 176,4 176,52"/><polygon points="120,40 176,13 176,43"/><polygon points="120,40 176,20 176,36"/></g><path class="fc" d="M120 40L176 28"/><polyline pathLength="1" points="8,64 22,62 36,57 50,49 64,53 78,46 92,39 106,35 120,40"/><text x="8" y="100">1월</text><text x="114" y="100">9월</text><text x="164" y="100">12월</text></svg>
</body>
</html>
