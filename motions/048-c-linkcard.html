<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링크 미리보기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 링크 미리보기 · 3.5s · 링크 뒤 카드 펼침 */
.mk-c-linkcard { display: grid; gap: 4px; width: 190px; font-size: 12px; }
.mk-c-linkcard p { margin: 0; justify-self: start; padding: 6px 10px; border-radius: 12px; background: var(--mk-bubble, #E3E7F0); color: var(--mk-accent, #2F5BFF); text-decoration: underline; }
.mk-c-linkcard div {
  display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 10px; background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
  animation: mk-c-linkcard 3.5s cubic-bezier(.2, .8, .2, 1) infinite;
}
.mk-c-linkcard i { flex: none; width: 40px; height: 40px; border-radius: 7px; background: linear-gradient(135deg, var(--mk-warn, #D99A00), var(--mk-danger, #E5484D)); }
.mk-c-linkcard span { display: grid; min-width: 0; }
.mk-c-linkcard small { color: var(--mk-ink-soft, #8A90A0); }
@keyframes mk-c-linkcard { 0%, 20% { opacity: 0; transform: translateY(-6px) scale(.97); } 35%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-c-linkcard"><p>gyodong.market/mango</p><div><i></i><span><b>제주 애플망고 2kg</b><small>교동마을 산지직송</small></span></div></div>
</body>
</html>
