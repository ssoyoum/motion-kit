<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업로드 완료 링</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 업로드 완료 링 · 3s · @property 0→100 후 체크 */
@property --mk-fb-upload-p { syntax: "<number>"; initial-value: 0; inherits: true; }
.mk-fb-upload { position: relative; width: 56px; height: 56px; display: grid; place-items: center; animation: mk-fb-upload 3s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-fb-upload::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--mk-accent, #2F5BFF) calc(var(--mk-fb-upload-p) * 1%), color-mix(in srgb, var(--mk-accent, #2F5BFF) 15%, transparent) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent 82%, #000 83%);
  mask: radial-gradient(farthest-side, transparent 82%, #000 83%);
}
.mk-fb-upload svg { width: 26px; height: 26px; fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; animation: mk-fb-upload-c 3s infinite; }
@keyframes mk-fb-upload { 0% { --mk-fb-upload-p: 0; } 60%, 100% { --mk-fb-upload-p: 100; } }
@keyframes mk-fb-upload-c { 0%, 62% { stroke-dashoffset: 20; opacity: 1; } 75%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
</head>
<body>
<div class="mk-fb-upload"><svg viewBox="0 0 24 24" aria-label="완료"><path d="M7.5 12.5l3 3 6-6.5"/></svg></div>
</body>
</html>
