<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맨 위로 버튼</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 맨 위로 버튼 · 4s · 스크롤 후 버튼 튕겨 등장 */
.mk-n-top { position: relative; width: 150px; height: 120px; overflow: hidden; border-radius: 12px; border: 1px solid var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); }
.mk-n-top > div { display: grid; gap: 6px; padding: 10px; animation: mk-n-top 4s ease-in-out infinite; }
.mk-n-top i { height: 14px; border-radius: 4px; background: var(--mk-skel-a, #E0E4EC); }
.mk-n-top b {
  position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 800 14px system-ui, sans-serif; box-shadow: 0 4px 10px rgb(0 0 0 / .2);
  animation: mk-n-top-b 4s infinite;
}
@keyframes mk-n-top { 0%, 20%, 95%, 100% { transform: none; } 45%, 80% { transform: translateY(-50px); } }
@keyframes mk-n-top-b {
  0%, 35% { opacity: 0; transform: translateY(8px) scale(.5); }
  45% { opacity: 1; transform: scale(1.1); animation-timing-function: ease-out; }
  50%, 80% { opacity: 1; transform: none; }
  90%, 100% { opacity: 0; transform: translateY(8px) scale(.5); }
}
</style>
</head>
<body>
<div class="mk-n-top"><div><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><b>↑</b></div>
</body>
</html>
