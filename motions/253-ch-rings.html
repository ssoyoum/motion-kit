<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3중 링 진행</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 3중 링 진행 · 3.2s · 82% / 64% / 45% */
.mk-ch-rings { width: 90px; height: 90px; transform: rotate(-90deg); }
.mk-ch-rings circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.mk-ch-rings circle:nth-child(-n+3) { stroke: var(--mk-skel-a, #E0E4EC); }
.mk-ch-rings circle:nth-child(4) { stroke: var(--mk-danger, #E5484D); stroke-dasharray: 213.6; animation: mk-ch-rings-a 3.2s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-ch-rings circle:nth-child(5) { stroke: var(--mk-success, #1F9D55); stroke-dasharray: 163.4; animation: mk-ch-rings-b 3.2s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-ch-rings circle:nth-child(6) { stroke: var(--mk-accent, #2F5BFF); stroke-dasharray: 113.1; animation: mk-ch-rings-c 3.2s cubic-bezier(.4, 0, .2, 1) infinite; }
@keyframes mk-ch-rings-a { 0%, 100% { stroke-dashoffset: 213.6; } 50%, 85% { stroke-dashoffset: 38.4; } }
@keyframes mk-ch-rings-b { 0%, 5%, 100% { stroke-dashoffset: 163.4; } 55%, 85% { stroke-dashoffset: 58.8; } }
@keyframes mk-ch-rings-c { 0%, 10%, 100% { stroke-dashoffset: 113.1; } 60%, 85% { stroke-dashoffset: 62.2; } }
</style>
</head>
<body>
<svg class="mk-ch-rings" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><circle cx="40" cy="40" r="26"/><circle cx="40" cy="40" r="18"/><circle cx="40" cy="40" r="34"/><circle cx="40" cy="40" r="26"/><circle cx="40" cy="40" r="18"/></svg>
</body>
</html>
