<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반대 방향 두 줄</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 반대 방향 두 줄 · 9s · 위 ← 아래 → · ∞ */
.mk-x-marq2 { width: 240px; overflow: hidden; display: grid; gap: 8px; -webkit-mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
.mk-x-marq2 div { display: flex; gap: 8px; width: max-content; animation: mk-x-marq2 9s linear infinite; }
.mk-x-marq2 .r { animation-direction: reverse; animation-duration: 11s; }
.mk-x-marq2 i { flex: none; width: 40px; height: 28px; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 600 12px system-ui, sans-serif; font-style: normal; }
@keyframes mk-x-marq2 { to { transform: translateX(calc(-50% - 4px)); } }
</style>
</head>
<body>
<div class="mk-x-marq2"><div><i>Aa</i><i>Bb</i><i>Cc</i><i>Dd</i><i>Ee</i><i>Ff</i><i>Aa</i><i>Bb</i><i>Cc</i><i>Dd</i><i>Ee</i><i>Ff</i></div><div class="r"><i>Aa</i><i>Bb</i><i>Cc</i><i>Dd</i><i>Ee</i><i>Ff</i><i>Aa</i><i>Bb</i><i>Cc</i><i>Dd</i><i>Ee</i><i>Ff</i></div></div>
</body>
</html>
