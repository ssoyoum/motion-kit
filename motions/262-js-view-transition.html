<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뷰 전환</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 뷰 전환 · startViewTransition(지원 시) · 아니면 FLIP · 0.45s · 클릭해 보세요 */
.mk-js-view-transition { position: relative; width: 220px; height: 124px; display: grid; place-items: center; }
.mk-js-view-transition .v {
  view-transition-name: mk-js-vt-card;
  display: grid; gap: 2px; padding: 10px 14px; border-radius: 12px;
  background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 13px system-ui, sans-serif;
}
.mk-js-view-transition .v b { font-weight: 800; }
.mk-js-view-transition .v small { opacity: .8; font-size: 11px; }
.mk-js-view-transition .v.big { position: absolute; inset: 0; align-content: end; padding: 16px; border-radius: 14px; font-size: 15px; }
.mk-js-view-transition button {
  position: absolute; right: 6px; top: 6px; z-index: 2; padding: 4px 10px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 600 11px system-ui, sans-serif;
  box-shadow: 0 1px 4px rgb(0 0 0 / .15);
}
::view-transition-group(mk-js-vt-card) { animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
</style>
</head>
<body>
<div class="mk-js-view-transition"><div class="v"><b>애플망고 2kg</b><small>목록</small></div><button type="button">전환</button></div>
<script>
document.querySelectorAll(".mk-js-view-transition").forEach(function (root) {
var v = root.querySelector(".v"), lastUser = 0;
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function swap() {
  var big = v.classList.toggle("big");
  v.querySelector("small").textContent = big ? "상세 · 산지에서 오늘 출고" : "목록";
}
function flip() {
  var a = v.getBoundingClientRect();
  swap();
  var b = v.getBoundingClientRect();
  if (reduce) return;
  v.animate([
    { transformOrigin: "0 0", transform: "translate(" + (a.left - b.left) + "px," + (a.top - b.top) + "px) scale(" + a.width / b.width + "," + a.height / b.height + ")" },
    { transformOrigin: "0 0", transform: "none" }
  ], { duration: 450, easing: "cubic-bezier(.2, .8, .2, 1)" });
}
root.querySelector("button").addEventListener("click", function () {
  lastUser = Date.now();
  if (document.startViewTransition && !reduce) document.startViewTransition(swap);
  else flip();
});
if (!reduce) {
  var timer = setInterval(function () {
    if (!root.isConnected) return clearInterval(timer);
    if (Date.now() - lastUser > 5000) flip();
  }, 2800);
}
});
</script>
</body>
</html>
