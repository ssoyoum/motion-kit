<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글리치</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 글리치 · 2s 중 0.2s만 어긋남 */
.mk-glitch { position: relative; display: inline-block; font: 900 26px system-ui, sans-serif; color: var(--mk-ink, #1B1E26); }
.mk-glitch::before, .mk-glitch::after { content: attr(data-t); position: absolute; inset: 0; opacity: 0; }
.mk-glitch::before { color: var(--mk-danger, #E5484D); clip-path: inset(0 0 55% 0); animation: mk-gl-a 2s infinite; }
.mk-glitch::after { color: var(--mk-accent, #2F5BFF); clip-path: inset(55% 0 0 0); animation: mk-gl-b 2s infinite; }
@keyframes mk-gl-a { 0%, 80%, 92%, 100% { opacity: 0; transform: none; } 82% { opacity: 1; transform: translate(-3px, -1px); } 87% { opacity: 1; transform: translate(3px, 1px); } }
@keyframes mk-gl-b { 0%, 80%, 92%, 100% { opacity: 0; transform: none; } 83% { opacity: 1; transform: translate(3px, 1px); } 88% { opacity: 1; transform: translate(-2px, 0); } }
</style>
</head>
<body>
<span class="mk-glitch" data-t="ERROR 404">ERROR 404</span>
</body>
</html>
