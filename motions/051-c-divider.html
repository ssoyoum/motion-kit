<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여기까지 읽음</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 여기까지 읽음 · 3.5s · 선이 가운데서 펼쳐짐 */
.mk-c-divider { display: grid; gap: 8px; width: 190px; font-size: 12px; }
.mk-c-divider p { margin: 0; justify-self: start; padding: 6px 10px; border-radius: 12px; background: var(--mk-bubble, #E3E7F0); }
.mk-c-divider p:first-child { opacity: .55; }
.mk-c-divider div { position: relative; display: grid; place-items: center; }
.mk-c-divider div::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--mk-accent, #2F5BFF); transform: scaleX(0); animation: mk-c-divider-l 3.5s cubic-bezier(.6, 0, .2, 1) infinite; }
.mk-c-divider span { position: relative; padding: 0 8px; background: var(--mk-stage, #ECEEF4); color: var(--mk-accent, #2F5BFF); font-size: 11px; font-weight: 700; animation: mk-c-divider-t 3.5s infinite; }
.mk-c-divider p:last-child { animation: mk-c-divider-m 3.5s cubic-bezier(.2, .8, .2, 1) infinite; }
@keyframes mk-c-divider-l { 0%, 10% { transform: scaleX(0); } 35%, 88% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes mk-c-divider-t { 0%, 25% { opacity: 0; } 35%, 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes mk-c-divider-m { 0%, 40% { opacity: 0; transform: translateY(6px); } 50%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-c-divider"><p>배송 시작했나요?</p><div><span>여기까지 읽었어요</span></div><p>방금 출발했어요</p></div>
</body>
</html>
