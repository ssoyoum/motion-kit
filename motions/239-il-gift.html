<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선물상자</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 선물상자 · 2.6s · 뚜껑 두 번 튕김 + 반짝이 */
.mk-il-gift { width: 190px; height: 105px; overflow: visible; }
.mk-il-gift .bx { fill: var(--mk-danger, #E5484D); }
.mk-il-gift .lidr { fill: color-mix(in srgb, var(--mk-danger, #E5484D) 82%, #000); }
.mk-il-gift .rb, .mk-il-gift .bow { fill: var(--mk-warn, #D99A00); }
.mk-il-gift .lid { transform-box: fill-box; transform-origin: center bottom; animation: mk-il-gift-lid 2.6s ease-out infinite; }
.mk-il-gift .spark circle { fill: var(--mk-warn, #D99A00); transform-box: fill-box; transform-origin: center; animation: mk-il-gift-spark 2.6s ease-out infinite; }
.mk-il-gift .spark circle:nth-child(2) { animation-delay: 0.06s; }
.mk-il-gift .spark circle:nth-child(3) { animation-delay: 0.12s; }
.mk-il-gift .spark circle:nth-child(4) { animation-delay: 0.18s; }
@keyframes mk-il-gift-lid {
  0%, 20%, 38%, 54%, 100% { transform: none; }
  28% { transform: translateY(-18px) rotate(-10deg); }
  46% { transform: translateY(-8px) rotate(6deg); }
}
@keyframes mk-il-gift-spark { 0%, 22% { transform: scale(0); opacity: 0; } 30% { transform: scale(1.4); opacity: 1; } 50%, 100% { transform: scale(0); opacity: 0; } }
</style>
</head>
<body>
<svg class="mk-il-gift" viewBox="0 0 200 110">
  <g class="spark"><circle cx="68" cy="30" r="3"/><circle cx="132" cy="28" r="3"/><circle cx="82" cy="16" r="2.5"/><circle cx="120" cy="14" r="2.5"/></g>
  <rect class="bx" x="66" y="56" width="68" height="46" rx="3"/>
  <rect class="rb" x="94" y="56" width="12" height="46"/>
  <g class="lid">
    <rect class="lidr" x="60" y="44" width="80" height="14" rx="3"/>
    <rect class="rb" x="94" y="44" width="12" height="14"/>
    <path class="bow" d="M100 44c-10-14-26-8-14 0zM100 44c10-14 26-8 14 0z"/>
  </g>
</svg>
</body>
</html>
