<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 섞기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 카드 섞기 · 6s · 카드 3장 2s씩 순환 */
.mk-tr-shuffle { position: relative; width: 130px; height: 96px; }
.mk-tr-shuffle i {
  position: absolute; left: 5px; right: 5px; bottom: 0; height: 74px; border-radius: 10px;
  display: grid; place-items: center; font: 800 14px/1 system-ui, sans-serif; font-style: normal; color: #fff;
  box-shadow: 0 4px 10px rgb(0 0 0 / .15); transform-origin: 50% 100%;
  animation: mk-tr-shuffle 6s cubic-bezier(.6, 0, .4, 1) infinite;
}
.mk-tr-shuffle i:nth-child(1) { background: var(--mk-accent, #2F5BFF); }
.mk-tr-shuffle i:nth-child(2) { background: var(--mk-success, #1F9D55); animation-delay: -2s; }
.mk-tr-shuffle i:nth-child(3) { background: var(--mk-danger, #E5484D); animation-delay: -4s; }
@keyframes mk-tr-shuffle {
  0%, 13% { transform: none; z-index: 3; }
  20% { transform: translateX(115%) rotate(10deg); z-index: 3; }
  27%, 46% { transform: translateY(-16px) scale(.88); z-index: 1; }
  53%, 80% { transform: translateY(-8px) scale(.94); z-index: 2; }
  87%, 100% { transform: none; z-index: 3; }
}
</style>
</head>
<body>
<div class="mk-tr-shuffle"><i>쿠폰 1</i><i>쿠폰 2</i><i>쿠폰 3</i></div>
</body>
</html>
