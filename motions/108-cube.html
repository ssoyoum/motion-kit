<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회전 큐브</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 회전 큐브 · 4s · 면 6개 · rotateY 360° */
.mk-cube-wrap { perspective: 300px; }
.mk-cube { position: relative; width: 40px; height: 40px; transform-style: preserve-3d; animation: mk-cube 4s linear infinite; }
.mk-cube i { position: absolute; inset: 0; border: 2px solid var(--mk-accent, #2F5BFF); background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 15%, transparent); }
.mk-cube i:nth-child(1) { transform: rotateY(0) translateZ(20px); }
.mk-cube i:nth-child(2) { transform: rotateY(90deg) translateZ(20px); }
.mk-cube i:nth-child(3) { transform: rotateY(180deg) translateZ(20px); }
.mk-cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(20px); }
.mk-cube i:nth-child(5) { transform: rotateX(90deg) translateZ(20px); }
.mk-cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(20px); }
@keyframes mk-cube { from { transform: rotateX(-25deg) rotateY(0); } to { transform: rotateX(-25deg) rotateY(360deg); } }
</style>
</head>
<body>
<div class="mk-cube-wrap"><div class="mk-cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
</body>
</html>
