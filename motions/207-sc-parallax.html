<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패럴랙스 배경</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 패럴랙스 배경 · view() · 배경만 -40px→40px · 안에서 스크롤해 보세요 */
.mk-sc-parallax { width: 200px; height: 130px; overflow: hidden auto; padding: 0 10px; border-radius: 12px; background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); scrollbar-width: thin; }
.mk-sc-parallax > p { height: 104px; margin: 0; display: grid; place-items: center; font: 600 11px system-ui, sans-serif; color: var(--mk-ink-soft, #8A90A0); }
.mk-sc-parallax > p:last-child { height: 40px; }
.mk-sc-parallax > div { position: relative; overflow: hidden; display: grid; place-items: center; height: 90px; margin-bottom: 10px; border-radius: 10px; }
.mk-sc-parallax i { position: absolute; inset: -40px 0; background: radial-gradient(circle at 30% 30%, var(--mk-accent, #2F5BFF) 0 18%, transparent 19%), radial-gradient(circle at 75% 65%, var(--mk-warn, #D99A00) 0 14%, transparent 15%), color-mix(in srgb, var(--mk-accent, #2F5BFF) 25%, var(--mk-surface, #fff)); }
.mk-sc-parallax > div + div i { background: radial-gradient(circle at 70% 30%, var(--mk-success, #1F9D55) 0 18%, transparent 19%), radial-gradient(circle at 25% 70%, var(--mk-accent, #2F5BFF) 0 12%, transparent 13%), color-mix(in srgb, var(--mk-success, #1F9D55) 25%, var(--mk-surface, #fff)); }
.mk-sc-parallax b { position: relative; font: 800 14px system-ui, sans-serif; color: var(--mk-ink, #1B1E26); }
@supports (animation-timeline: view()) {
  .mk-sc-parallax i { animation: mk-sc-parallax linear both; animation-timeline: view(); }
}
@keyframes mk-sc-parallax { from { transform: translateY(-40px); } to { transform: translateY(40px); } }
</style>
</head>
<body>
<div class="mk-sc-parallax"><p>↓ 안에서 스크롤해 보세요</p><div><i></i><b>봄 컬렉션</b></div><div><i></i><b>여름 컬렉션</b></div><p></p></div>
</body>
</html>
