<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 펼치기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 카드 펼치기 · 2.8s · ±18° 부채꼴 */
.mk-fan { position: relative; width: 70px; height: 90px; }
.mk-fan i { position: absolute; inset: 0; border-radius: 10px; border: 2px solid var(--mk-surface, #fff); transform-origin: 50% 100%; animation: 2.8s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-fan i:nth-child(1) { background: var(--mk-danger, #E5484D); animation-name: mk-fan-a; }
.mk-fan i:nth-child(2) { background: var(--mk-success, #1F9D55); }
.mk-fan i:nth-child(3) { background: var(--mk-accent, #2F5BFF); animation-name: mk-fan-c; }
@keyframes mk-fan-a { 0%, 20%, 100% { transform: none; } 40%, 80% { transform: rotate(-18deg); } }
@keyframes mk-fan-c { 0%, 20%, 100% { transform: none; } 40%, 80% { transform: rotate(18deg); } }
</style>
</head>
<body>
<div class="mk-fan"><i></i><i></i><i></i></div>
</body>
</html>
