<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리 퍼짐</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 소리 퍼짐 · 1.6s · 물결 3줄 0.2s씩 */
.mk-ic-volume { width: 44px; height: 44px; overflow: visible; }
.mk-ic-volume .sp { fill: var(--mk-ink, #1B1E26); }
.mk-ic-volume .w { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 1.8; stroke-linecap: round; opacity: .15; animation: mk-ic-volume 1.6s infinite; }
.mk-ic-volume .w2 { animation-delay: .2s; }
.mk-ic-volume .w3 { animation-delay: .4s; }
@keyframes mk-ic-volume { 0%, 20% { opacity: .15; } 40%, 80% { opacity: 1; } 100% { opacity: .15; } }
</style>
</head>
<body>
<svg class="mk-ic-volume" viewBox="0 0 24 24" aria-label="소리"><path class="sp" d="M3 9h4l5-4v14l-5-4H3z"/><path class="w w1" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="w w2" d="M18 7a7 7 0 0 1 0 10"/><path class="w w3" d="M20.5 4.5a10.5 10.5 0 0 1 0 15"/></svg>
</body>
</html>
