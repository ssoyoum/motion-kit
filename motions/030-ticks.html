<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전송·읽음 체크</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 전송·읽음 체크 · 2.4s · 체크 2개 순차 */
.mk-ticks { width: 44px; height: 28px; fill: none; stroke: var(--mk-success, #1F9D55); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mk-ticks path { stroke-dasharray: 18; stroke-dashoffset: 18; animation: mk-ticks-a 2.4s infinite; }
.mk-ticks path:last-child { animation-name: mk-ticks-b; }
@keyframes mk-ticks-a { 0% { stroke-dashoffset: 18; } 20%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 18; } }
@keyframes mk-ticks-b { 0%, 35% { stroke-dashoffset: 18; } 55%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 18; } }
</style>
</head>
<body>
<svg class="mk-ticks" viewBox="0 0 26 16" aria-label="읽음"><path d="M2 8l4 4 8-9"/><path d="M10 11l1 1 8-9"/></svg>
</body>
</html>
