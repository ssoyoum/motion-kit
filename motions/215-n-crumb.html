<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경로 순차 등장</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 경로 순차 등장 · 4s · 단계당 0.25s */
.mk-n-crumb { display: flex; gap: 4px; font: 13px system-ui, sans-serif; color: var(--mk-ink-soft, #8A90A0); }
.mk-n-crumb span { display: inline-block; opacity: 0; animation: mk-n-crumb 4s cubic-bezier(.2, .8, .2, 1) infinite; }
.mk-n-crumb span:not(:last-child)::after { content: "›"; margin-left: 4px; }
.mk-n-crumb span:last-child { color: var(--mk-accent, #2F5BFF); font-weight: 700; }
.mk-n-crumb span:nth-child(2) { animation-delay: 0.25s; }
.mk-n-crumb span:nth-child(3) { animation-delay: 0.50s; }
.mk-n-crumb span:nth-child(4) { animation-delay: 0.75s; }
@keyframes mk-n-crumb { 0% { opacity: 0; transform: translateX(-6px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<nav class="mk-n-crumb"><span>홈</span><span>과일</span><span>감귤류</span><span>한라봉</span></nav>
</body>
</html>
