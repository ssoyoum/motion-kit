<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블라인드</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 블라인드 · 4s · 살 5개 0.06s씩 */
.mk-tr-shutter {
  display: grid; grid-template-rows: repeat(5, 1fr); width: 160px; height: 100px; border-radius: 12px; overflow: hidden;
  background: linear-gradient(135deg, var(--mk-success, #1F9D55), var(--mk-accent, #2F5BFF));
}
.mk-tr-shutter i { background: var(--mk-ink, #1B1E26); transform-origin: top; animation: mk-tr-shutter 4s cubic-bezier(.7, 0, .3, 1) infinite; }
.mk-tr-shutter i:nth-child(2) { animation-delay: 0.06s; }
.mk-tr-shutter i:nth-child(3) { animation-delay: 0.12s; }
.mk-tr-shutter i:nth-child(4) { animation-delay: 0.18s; }
.mk-tr-shutter i:nth-child(5) { animation-delay: 0.24s; }
@keyframes mk-tr-shutter { 0%, 15% { transform: scaleY(1); } 45%, 85% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
</style>
</head>
<body>
<div class="mk-tr-shutter"><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
