<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스몰 멀티플 이상 강조</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 스몰 멀티플 이상 강조 · 4s · 12칸 선 그리기 → 이상 칸 붉게 */
.mk-an-small { display: grid; grid-template-columns: repeat(4, 46px); gap: 4px; }
.mk-an-small > div { position: relative; padding: 12px 3px 3px; border-radius: 5px; background: var(--mk-skel-b, #F4F5F8); border: 1px solid var(--mk-skel-a, #E0E4EC); }
.mk-an-small span { position: absolute; top: 2px; left: 4px; font: 600 7px system-ui, sans-serif; color: var(--mk-ink-soft, #8A90A0); }
.mk-an-small svg { display: block; width: 100%; height: 16px; overflow: visible; }
.mk-an-small polyline { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; animation: mk-an-small 4s ease-out var(--d) infinite both; }
.mk-an-small .hl { animation: mk-an-small-bg 4s var(--d) infinite both; }
.mk-an-small .hl polyline { animation: mk-an-small 4s ease-out var(--d) infinite both, mk-an-small-st 4s var(--d) infinite both; }
.mk-an-small .hl span { color: var(--mk-ink, #1B1E26); }
@keyframes mk-an-small { 0% { stroke-dashoffset: 1; opacity: 1; } 30%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes mk-an-small-bg { 0%, 38% { background: var(--mk-skel-b, #F4F5F8); border-color: var(--mk-skel-a, #E0E4EC); } 48%, 90% { background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 14%, transparent); border-color: var(--mk-accent, #2F5BFF); } 100% { background: var(--mk-skel-b, #F4F5F8); border-color: var(--mk-skel-a, #E0E4EC); } }
@keyframes mk-an-small-st { 0%, 38%, 100% { stroke: var(--mk-ink, #1B1E26); } 48%, 90% { stroke: var(--mk-accent, #2F5BFF); } }
</style>
</head>
<body>
<div class="mk-an-small"><div style="--d:0.00s"><span>C01</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,10.9 5,11.4 10,8.3 15,9.2 20,10.6 25,11 30,8 35,13.7 40,11.6"/></svg></div><div style="--d:0.06s"><span>C02</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,10.4 5,9.5 10,13 15,12.1 20,8 25,11 30,9.1 35,12.2 40,8.6"/></svg></div><div style="--d:0.12s"><span>C03</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,11.4 5,10.9 10,8.7 15,7.9 20,14.1 25,14.3 30,8.3 35,10.6 40,14.2"/></svg></div><div style="--d:0.18s"><span>C04</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,8.8 5,10.4 10,11.4 15,12.2 20,9.5 25,8.7 30,14.4 35,10.6 40,9.1"/></svg></div><div style="--d:0.24s"><span>C05</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,11.3 5,9.8 10,8.6 15,12.9 20,10 25,10 30,8.1 35,14 40,9.2"/></svg></div><div style="--d:0.30s"><span>C06</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,13.7 5,10.8 10,9.2 15,11.7 20,10.3 25,12.8 30,12.1 35,8.5 40,9.1"/></svg></div><div style="--d:0.36s"><span>C07</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,10.7 5,8.1 10,7.8 15,10.4 20,12.3 25,12 30,14.2 35,9.8 40,10.6"/></svg></div><div class="hl" style="--d:0.42s"><span>C08</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,5 5,6.4 10,8.7 15,9.4 20,10.9 25,12 30,13.5 35,16 40,16.3"/></svg></div><div style="--d:0.48s"><span>C09</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,9.4 5,12.9 10,13.5 15,14.3 20,14 25,13.5 30,12.7 35,12 40,11.4"/></svg></div><div style="--d:0.54s"><span>C10</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,7.7 5,9.8 10,10 15,9 20,10.3 25,12.3 30,12.7 35,9.4 40,14.2"/></svg></div><div style="--d:0.60s"><span>C11</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,7.5 5,10 10,11.6 15,10.6 20,8.1 25,14.4 30,10.7 35,13.6 40,11.6"/></svg></div><div style="--d:0.66s"><span>C12</span><svg viewBox="0 0 40 20"><polyline pathLength="1" points="0,10.8 5,8.4 10,13.1 15,13.8 20,9.4 25,7.7 30,8.6 35,12.4 40,12.4"/></svg></div></div>
</body>
</html>
