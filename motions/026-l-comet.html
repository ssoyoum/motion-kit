<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬리 달린 점</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 꼬리 달린 점 · 1s · linear · 점 6개 18°씩 */
.mk-l-comet { position: relative; width: 44px; height: 44px; animation: mk-l-comet 1s linear infinite; }
.mk-l-comet i {
  position: absolute; left: 50%; top: 0; width: var(--s); height: var(--s); margin-left: calc(var(--s) / -2);
  border-radius: 50%; background: var(--mk-accent, #2F5BFF); transform-origin: 50% 22px; transform: rotate(var(--r)); opacity: var(--o);
}
.mk-l-comet i:nth-child(1) { --s: 10.0px; --r: 0deg; --o: 1.00; }
.mk-l-comet i:nth-child(2) { --s: 8.6px; --r: -18deg; --o: 0.85; }
.mk-l-comet i:nth-child(3) { --s: 7.2px; --r: -36deg; --o: 0.70; }
.mk-l-comet i:nth-child(4) { --s: 5.8px; --r: -54deg; --o: 0.55; }
.mk-l-comet i:nth-child(5) { --s: 4.4px; --r: -72deg; --o: 0.40; }
.mk-l-comet i:nth-child(6) { --s: 3.0px; --r: -90deg; --o: 0.25; }
@keyframes mk-l-comet { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="mk-l-comet"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
