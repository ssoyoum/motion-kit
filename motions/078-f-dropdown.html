<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드롭다운 펼침</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 드롭다운 펼침 · 3.5s · scaleY 0.6→1 + 화살표 180° */
.mk-f-dropdown { position: relative; width: 170px; font: 13px system-ui, sans-serif; }
.mk-f-dropdown button {
  width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
  border: 1.5px solid var(--mk-line, #DCE0EA); border-radius: 8px; background: var(--mk-surface, #fff); color: inherit; font: inherit;
}
.mk-f-dropdown i { font-style: normal; animation: mk-f-dropdown-a 3.5s infinite; }
.mk-f-dropdown ul {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); border-radius: 8px;
  box-shadow: 0 8px 20px rgb(0 0 0 / .12); transform-origin: top;
  animation: mk-f-dropdown 3.5s cubic-bezier(.2, .8, .2, 1) infinite;
}
.mk-f-dropdown li { padding: 6px 8px; border-radius: 6px; }
.mk-f-dropdown li:nth-child(2) { background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 12%, transparent); color: var(--mk-accent, #2F5BFF); font-weight: 600; }
@keyframes mk-f-dropdown { 0%, 15% { opacity: 0; transform: scaleY(.6) translateY(-4px); } 25%, 80% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: scaleY(.6); } }
@keyframes mk-f-dropdown-a { 0%, 15%, 90%, 100% { transform: none; } 25%, 80% { transform: rotate(180deg); } }
</style>
</head>
<body>
<div class="mk-f-dropdown"><button type="button">배송지 선택 <i>▾</i></button><ul><li>집</li><li>회사</li><li>부모님 댁</li></ul></div>
</body>
</html>
