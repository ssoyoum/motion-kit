<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>따라오는 조명</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 따라오는 조명 · --x/--y 갱신 · 반지름 70px · 마우스를 올려 보세요 */
.mk-js-spotlight {
  --x: 50%; --y: 50%;
  position: relative; overflow: hidden; width: 220px; height: 120px; border-radius: 12px;
  display: grid; place-items: center; background: #11141B;
}
.mk-js-spotlight::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle 70px at var(--x) var(--y), color-mix(in srgb, var(--mk-accent, #2F5BFF) 60%, transparent), transparent 75%);
}
.mk-js-spotlight p { position: relative; margin: 0; text-align: center; font: 800 16px/1.35 system-ui, sans-serif; color: rgb(255 255 255 / .88); }
</style>
</head>
<body>
<div class="mk-js-spotlight"><p>숨은 혜택을<br>찾아보세요</p></div>
<script>
document.querySelectorAll(".mk-js-spotlight").forEach(function (root) {
var lastMove = 0, t = 0;
root.addEventListener("pointermove", function (e) {
  var r = root.getBoundingClientRect();
  lastMove = performance.now();
  root.style.setProperty("--x", e.clientX - r.left + "px");
  root.style.setProperty("--y", e.clientY - r.top + "px");
});
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  var timer = setInterval(function () {
    if (!root.isConnected) return clearInterval(timer);
    if (performance.now() - lastMove < 1500) return;
    t += 0.035;
    root.style.setProperty("--x", 110 + 85 * Math.cos(t) + "px");
    root.style.setProperty("--y", 60 + 35 * Math.sin(1.7 * t) + "px");
  }, 30);
}
});
</script>
</body>
</html>
