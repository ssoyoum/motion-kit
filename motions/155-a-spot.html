<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스포트라이트</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 스포트라이트 · 4s · @property 원형 구멍 이동 */
@property --mk-a-spot-x { syntax: "<percentage>"; initial-value: 20%; inherits: false; }
.mk-a-spot {
  position: relative; display: flex; gap: 8px; padding: 10px; border-radius: 12px; overflow: hidden;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
}
.mk-a-spot i { width: 44px; height: 56px; border-radius: 8px; background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 30%, transparent); }
.mk-a-spot i:nth-child(2) { background: color-mix(in srgb, var(--mk-danger, #E5484D) 30%, transparent); }
.mk-a-spot i:nth-child(3) { background: color-mix(in srgb, var(--mk-success, #1F9D55) 30%, transparent); }
.mk-a-spot::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle 34px at var(--mk-a-spot-x) 50%, transparent 0 28px, rgb(0 0 0 / .55) 34px);
  animation: mk-a-spot 4s cubic-bezier(.6, 0, .4, 1) infinite;
}
@keyframes mk-a-spot {
  0%, 15% { --mk-a-spot-x: 20%; }
  33%, 48% { --mk-a-spot-x: 50%; }
  66%, 81% { --mk-a-spot-x: 80%; }
  100% { --mk-a-spot-x: 20%; }
}
</style>
</head>
<body>
<div class="mk-a-spot"><i></i><i></i><i></i></div>
</body>
</html>
