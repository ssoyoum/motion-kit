<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매달린 간판</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 매달린 간판 · 2.6s · ±8° 진자 */
.mk-a-swing { width: 110px; transform-origin: 50% 4px; animation: mk-a-swing 2.6s ease-in-out infinite; }
.mk-a-swing svg { display: block; width: 110px; height: 36px; fill: var(--mk-ink-soft, #8A90A0); stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 2; }
.mk-a-swing span {
  display: grid; place-items: center; height: 44px; margin-top: -2px; border-radius: 8px;
  background: var(--mk-success, #1F9D55); color: #fff; font: 800 16px system-ui, sans-serif;
  box-shadow: 0 4px 0 rgb(0 0 0 / .15);
}
@keyframes mk-a-swing { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-8deg); } }
</style>
</head>
<body>
<div class="mk-a-swing"><svg viewBox="0 0 110 36"><path d="M55 4L14 35M55 4l41 31"/><circle cx="55" cy="4" r="3"/></svg><span>영업 중</span></div>
</body>
</html>
