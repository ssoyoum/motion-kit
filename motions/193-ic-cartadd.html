<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장바구니 +1</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 장바구니 +1 · 2.4s · 배지 튀어나와 떠오름 */
.mk-ic-cartadd { position: relative; width: 44px; height: 44px; }
.mk-ic-cartadd svg { width: 44px; height: 44px; animation: mk-ic-cartadd-bump 2.4s infinite; }
.mk-ic-cartadd path { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mk-ic-cartadd circle { fill: var(--mk-ink, #1B1E26); }
.mk-ic-cartadd b {
  position: absolute; top: -8px; right: -10px; padding: 1px 6px; border-radius: 999px;
  background: var(--mk-danger, #E5484D); color: #fff; font: 700 11px/1.5 system-ui, sans-serif;
  animation: mk-ic-cartadd 2.4s infinite;
}
@keyframes mk-ic-cartadd {
  0%, 20% { transform: scale(0); opacity: 0; }
  30% { transform: scale(1.25); opacity: 1; }
  40%, 70% { transform: scale(1); opacity: 1; }
  90%, 100% { transform: translateY(-12px); opacity: 0; }
}
@keyframes mk-ic-cartadd-bump { 0%, 24%, 38%, 100% { transform: none; } 30% { transform: translateY(2px); } }
</style>
</head>
<body>
<div class="mk-ic-cartadd"><svg viewBox="0 0 24 24" aria-label="장바구니"><path d="M3 4h2.5l2.2 10.5h10.6L20.5 7H7"/><circle cx="9" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg><b>+1</b></div>
</body>
</html>
