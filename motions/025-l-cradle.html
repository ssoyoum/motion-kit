<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴턴 진자</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 뉴턴 진자 · 1.2s · 양끝 공 ±30° */
.mk-l-cradle { display: flex; height: 60px; }
.mk-l-cradle i { position: relative; width: 14px; height: 60px; transform-origin: 50% 0; }
.mk-l-cradle i::before { content: ""; position: absolute; left: 6.5px; top: 0; width: 1px; height: 46px; background: var(--mk-ink-soft, #8A90A0); }
.mk-l-cradle i::after { content: ""; position: absolute; left: 0; bottom: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--mk-accent, #2F5BFF); }
.mk-l-cradle i:first-child { animation: mk-l-cradle-a 1.2s ease-in-out infinite; }
.mk-l-cradle i:last-child { animation: mk-l-cradle-b 1.2s ease-in-out infinite; }
@keyframes mk-l-cradle-a { 0%, 50%, 100% { transform: none; } 25% { transform: rotate(30deg); } }
@keyframes mk-l-cradle-b { 0%, 50%, 100% { transform: none; } 75% { transform: rotate(-30deg); } }
</style>
</head>
<body>
<div class="mk-l-cradle"><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
