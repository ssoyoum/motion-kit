<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테두리 빛 카드</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 테두리 빛 카드 · 0.3s · 테두리 2px + 번짐 · 마우스를 올려 보세요 */
.mk-cd-glow {
  width: 160px; display: grid; gap: 4px; padding: 14px; border-radius: 12px; cursor: pointer;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
  font: 600 13px system-ui, sans-serif; color: var(--mk-ink, #1B1E26);
  transition: border-color .3s, box-shadow .3s;
}
.mk-cd-glow span { color: var(--mk-ink-soft, #8A90A0); font-weight: 500; font-size: 12px; }
.mk-cd-glow:hover, .mk-cd-glow:focus-visible {
  border-color: var(--mk-accent, #2F5BFF);
  box-shadow: 0 0 0 1px var(--mk-accent, #2F5BFF), 0 0 22px color-mix(in srgb, var(--mk-accent, #2F5BFF) 40%, transparent);
}
</style>
</head>
<body>
<article class="mk-cd-glow" tabindex="0"><b>정기배송</b><span>월 2회 · 10% 할인</span></article>
</body>
</html>
