<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리도 이상점 감지</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 관리도 이상점 감지 · 4.2s · 평균 ±3σ 밖 점에 고리 맥박 */
.mk-an-control { width: 200px; height: 112px; overflow: visible; }
.mk-an-control .m { stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 1.5; }
.mk-an-control .g { stroke: var(--mk-accent, #2F5BFF); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
.mk-an-control text { font: 500 9px system-ui, sans-serif; fill: var(--mk-ink-soft, #8A90A0); fill: var(--mk-accent, #2F5BFF); }
.mk-an-control polyline { fill: none; stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 1; stroke-linejoin: round; stroke-dasharray: 1; animation: mk-an-control 4.2s linear infinite both; }
.mk-an-control circle { fill: var(--mk-ink, #1B1E26); transform-box: fill-box; transform-origin: center; animation: mk-an-control-dot 4.2s var(--d) infinite both; }
.mk-an-control .x { fill: var(--mk-accent, #2F5BFF); }
.mk-an-control .o { fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 1.5; animation: mk-an-control-ring 4.2s var(--d) infinite both; }
@keyframes mk-an-control { 0% { stroke-dashoffset: 1; opacity: 1; } 28%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes mk-an-control-dot { 0% { transform: scale(0); opacity: 1; } 5%, 66% { transform: scale(1); opacity: 1; } 75%, 100% { transform: scale(1); opacity: 0; } }
@keyframes mk-an-control-ring { 0% { transform: scale(.4); opacity: 0; } 10% { opacity: 1; } 25% { transform: scale(1.4); opacity: 0; } 26% { transform: scale(.4); opacity: 0; } 34% { opacity: 1; } 49%, 100% { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>

<path class="g" d="M10 26H174M10 74H174"/><path class="m" d="M10 50H174"/>
