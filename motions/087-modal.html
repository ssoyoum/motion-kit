<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모달 팝업</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 모달 팝업 · 3s · scale 0.85→1 + 배경 어둡게 */
.mk-modal { position: relative; width: 140px; height: 100px; border-radius: 14px; overflow: hidden; background: var(--mk-skel-a, #E0E4EC); }
.mk-modal::before { content: ""; position: absolute; inset: 0; background: rgb(0 0 0 / .35); animation: mk-modal-bg 3s infinite; }
.mk-modal i { position: absolute; left: 18%; right: 18%; top: 28%; bottom: 28%; border-radius: 10px; background: var(--mk-surface, #fff); animation: mk-modal 3s cubic-bezier(.2, .8, .2, 1) infinite; }
@keyframes mk-modal { 0% { opacity: 0; transform: scale(.85); } 15%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(.95); } }
@keyframes mk-modal-bg { 0% { opacity: 0; } 15%, 80% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-modal"><i></i></div>
</body>
</html>
