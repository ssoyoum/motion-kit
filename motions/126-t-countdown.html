<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3·2·1 카운트다운</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 3·2·1 카운트다운 · 4s · 숫자당 1s */
.mk-t-countdown { display: grid; place-items: center; width: 120px; height: 70px; }
.mk-t-countdown span { grid-area: 1 / 1; font: 900 40px system-ui, sans-serif; opacity: 0; animation: mk-t-countdown 4s infinite; }
.mk-t-countdown span:nth-child(2) { animation-delay: 1s; }
.mk-t-countdown span:nth-child(3) { animation-delay: 2s; }
.mk-t-countdown span:nth-child(4) { animation-delay: 3s; color: var(--mk-accent, #2F5BFF); font-size: 30px; }
@keyframes mk-t-countdown {
  0% { transform: scale(2); opacity: 0; }
  5%, 20% { transform: none; opacity: 1; }
  25%, 100% { transform: scale(.5); opacity: 0; }
}
</style>
</head>
<body>
<div class="mk-t-countdown"><span>3</span><span>2</span><span>1</span><span>시작!</span></div>
</body>
</html>
