<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI 숫자 상승</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* KPI 숫자 상승 · 3s · @property 0→128 + 증감 배지 */
@property --mk-ch-kpi-n { syntax: "<integer>"; initial-value: 0; inherits: true; }
.mk-ch-kpi {
  display: grid; gap: 4px; min-width: 150px; padding: 12px 14px; border-radius: 12px;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
  counter-reset: k var(--mk-ch-kpi-n); animation: mk-ch-kpi 3s cubic-bezier(.2, .8, .2, 1) infinite;
}
.mk-ch-kpi span { font: 500 12px system-ui, sans-serif; color: var(--mk-ink-soft, #8A90A0); }
.mk-ch-kpi b { font: 800 24px/1.1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.mk-ch-kpi b::after { content: counter(k) "만원"; }
.mk-ch-kpi em {
  justify-self: start; padding: 2px 6px; border-radius: 6px; font: 700 12px system-ui, sans-serif; font-style: normal;
  background: color-mix(in srgb, var(--mk-success, #1F9D55) 15%, transparent); color: var(--mk-success, #1F9D55);
  animation: mk-ch-kpi-up 3s infinite;
}
@keyframes mk-ch-kpi { 0% { --mk-ch-kpi-n: 0; } 60%, 100% { --mk-ch-kpi-n: 128; } }
@keyframes mk-ch-kpi-up { 0%, 55% { opacity: 0; transform: translateY(6px); } 65%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-ch-kpi"><span>오늘 매출</span><b></b><em>▲ 18%</em></div>
</body>
</html>
