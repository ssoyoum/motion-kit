<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올리면 흔들기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 올리면 흔들기 · 0.3s 반복 · 마우스를 올려 보세요 */
.mk-sh-hover { padding: 10px 20px; border: 0; border-radius: 10px; cursor: pointer; background: var(--mk-danger, #E5484D); color: #fff; font: 700 14px system-ui, sans-serif; }
.mk-sh-hover:hover, .mk-sh-hover:focus-visible { animation: mk-sh-hover .3s linear infinite; }
@keyframes mk-sh-hover { 0% { transform: none; } 16.7% { transform: translate(1.9px, 0.4px) rotate(0.6deg); } 33.3% { transform: translate(1.3px, 1.2px) rotate(-0.9deg); } 50% { transform: translate(-0.3px, -1.1px) rotate(-1.1deg); } 66.7% { transform: translate(-1.2px, -0.8px) rotate(1.9deg); } 83.3% { transform: translate(0.2px, -0.4px) rotate(1.6deg); } 100% { transform: none; } }
</style>
</head>
<body>
<button class="mk-sh-hover" type="button">탈퇴하기</button>
</body>
</html>
