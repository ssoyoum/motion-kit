<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별 돌며 채우기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 별 돌며 채우기 · 2.4s · 144° 회전 + 채움 */
.mk-ic-star { width: 44px; height: 44px; overflow: visible; }
.mk-ic-star path {
  fill: transparent; stroke: var(--mk-warn, #D99A00); stroke-width: 1.6; stroke-linejoin: round;
  transform-box: fill-box; transform-origin: center; animation: mk-ic-star 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
}
@keyframes mk-ic-star {
  0%, 20% { transform: rotate(0) scale(1); fill: transparent; }
  45% { transform: rotate(144deg) scale(1.2); fill: var(--mk-warn, #D99A00); }
  55%, 85% { transform: rotate(144deg) scale(1); fill: var(--mk-warn, #D99A00); }
  100% { transform: rotate(144deg) scale(1); fill: transparent; }
}
</style>
</head>
<body>
<svg class="mk-ic-star" viewBox="0 0 24 24" aria-label="즐겨찾기"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
</body>
</html>
