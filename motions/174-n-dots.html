<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐러셀 점</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 캐러셀 점 · 5s · 슬라이드 1s씩 · 현재 점이 길어짐 */
.mk-n-dots { display: grid; gap: 8px; justify-items: center; }
.mk-n-dots-view { width: 160px; height: 80px; overflow: hidden; border-radius: 10px; }
.mk-n-dots-track { display: flex; animation: mk-n-dots 5s cubic-bezier(.6, 0, .2, 1) infinite; }
.mk-n-dots-track i { flex: none; width: 160px; height: 80px; }
.mk-n-dots-track i:nth-child(1) { background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 70%, transparent); }
.mk-n-dots-track i:nth-child(2) { background: color-mix(in srgb, var(--mk-success, #1F9D55) 70%, transparent); }
.mk-n-dots-track i:nth-child(3) { background: color-mix(in srgb, var(--mk-warn, #D99A00) 70%, transparent); }
.mk-n-dots-track i:nth-child(4) { background: color-mix(in srgb, var(--mk-danger, #E5484D) 70%, transparent); }
.mk-n-dots-track i:nth-child(5) { background: color-mix(in srgb, var(--mk-ink-soft, #8A90A0) 70%, transparent); }
.mk-n-dots p { margin: 0; display: flex; gap: 5px; }
.mk-n-dots b { width: 6px; height: 6px; border-radius: 3px; background: var(--mk-line, #DCE0EA); animation: mk-n-dots-d 5s infinite; }
.mk-n-dots b:nth-child(2) { animation-delay: 1s; }
.mk-n-dots b:nth-child(3) { animation-delay: 2s; }
.mk-n-dots b:nth-child(4) { animation-delay: 3s; }
.mk-n-dots b:nth-child(5) { animation-delay: 4s; }
@keyframes mk-n-dots {
  0%, 16% { transform: none; }
  20%, 36% { transform: translateX(-160px); }
  40%, 56% { transform: translateX(-320px); }
  60%, 76% { transform: translateX(-480px); }
  80%, 96% { transform: translateX(-640px); }
  100% { transform: none; }
}
@keyframes mk-n-dots-d { 0%, 18% { width: 18px; background: var(--mk-accent, #2F5BFF); } 21%, 100% { width: 6px; background: var(--mk-line, #DCE0EA); } }
</style>
</head>
<body>
<div class="mk-n-dots"><div class="mk-n-dots-view"><div class="mk-n-dots-track"><i></i><i></i><i></i><i></i><i></i></div></div><p><b></b><b></b><b></b><b></b><b></b></p></div>
</body>
</html>
