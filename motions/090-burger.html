<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 ↔ 닫기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 메뉴 ↔ 닫기 · 2.4s · 선 3개 → X */
.mk-burger { display: grid; gap: 5px; width: 28px; }
.mk-burger i { height: 3px; border-radius: 2px; background: var(--mk-ink, #1B1E26); animation: 2.4s cubic-bezier(.6, 0, .4, 1) infinite; }
.mk-burger i:nth-child(1) { animation-name: mk-bg1; }
.mk-burger i:nth-child(2) { animation-name: mk-bg2; }
.mk-burger i:nth-child(3) { animation-name: mk-bg3; }
@keyframes mk-bg1 { 0%, 30%, 100% { transform: none; } 45%, 85% { transform: translateY(8px) rotate(45deg); } }
@keyframes mk-bg2 { 0%, 30%, 100% { opacity: 1; } 45%, 85% { opacity: 0; } }
@keyframes mk-bg3 { 0%, 30%, 100% { transform: none; } 45%, 85% { transform: translateY(-8px) rotate(-45deg); } }
</style>
</head>
<body>
<div class="mk-burger"><i></i><i></i><i></i></div>
</body>
</html>
