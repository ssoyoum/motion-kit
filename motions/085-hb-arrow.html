<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화살표 등장</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 화살표 등장 · 0.3s · 화살표 폭 0→1em · 마우스를 올려 보세요 */
.mk-hb-arrow {
  display: inline-flex; align-items: center; gap: 0; padding: 10px 20px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--mk-ink, #1B1E26); color: var(--mk-on-ink, #fff); font: 700 14px system-ui, sans-serif;
  transition: gap .3s cubic-bezier(.2, .8, .2, 1);
}
.mk-hb-arrow i {
  display: inline-block; width: 0; overflow: hidden; opacity: 0; font-style: normal;
  transform: translateX(-6px); transition: width .3s cubic-bezier(.2, .8, .2, 1), opacity .3s, transform .3s;
}
.mk-hb-arrow:hover, .mk-hb-arrow:focus-visible { gap: 8px; }
.mk-hb-arrow:hover i, .mk-hb-arrow:focus-visible i { width: 1em; opacity: 1; transform: none; }
</style>
</head>
<body>
<button class="mk-hb-arrow" type="button"><span>다음 단계</span><i>→</i></button>
</body>
</html>
