<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자석 버튼</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 자석 버튼 · 버튼 중심과 거리 × 0.35 · 마우스를 올려 보세요 */
.mk-js-magnet { width: 220px; height: 120px; display: grid; place-items: center; }
.mk-js-magnet button {
  padding: 12px 24px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 700 14px system-ui, sans-serif;
  box-shadow: 0 6px 16px color-mix(in srgb, var(--mk-accent, #2F5BFF) 35%, transparent);
  transition: transform .25s cubic-bezier(.2, .8, .2, 1);
}
.mk-js-magnet button:focus-visible { outline: 2px solid var(--mk-ink, #1B1E26); outline-offset: 3px; }
</style>
</head>
<body>
<div class="mk-js-magnet"><button type="button">지금 구매</button></div>
<script>
document.querySelectorAll(".mk-js-magnet").forEach(function (root) {
var b = root.querySelector("button");
root.addEventListener("pointermove", function (e) {
  var r = b.getBoundingClientRect();
  var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  b.style.transform = "translate(" + dx * 0.35 + "px," + dy * 0.45 + "px)";
});
root.addEventListener("pointerleave", function () { b.style.transform = ""; });
});
</script>
</body>
</html>
