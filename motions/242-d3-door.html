<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문 열림</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 문 열림 · 3.6s · rotateY -75° */
.mk-d3-door {
  position: relative; width: 70px; height: 100px; perspective: 300px; border-radius: 4px 4px 0 0;
  border: 4px solid var(--mk-ink, #1B1E26); border-bottom: 0;
  background: linear-gradient(var(--mk-warn, #D99A00), color-mix(in srgb, var(--mk-warn, #D99A00) 55%, #fff));
}
.mk-d3-door i { position: absolute; inset: 0; background: var(--mk-accent, #2F5BFF); transform-origin: left; animation: mk-d3-door 3.6s cubic-bezier(.6, 0, .4, 1) infinite; }
.mk-d3-door i::after { content: ""; position: absolute; right: 8px; top: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--mk-warn, #D99A00); }
@keyframes mk-d3-door { 0%, 20%, 100% { transform: none; } 50%, 80% { transform: rotateY(-75deg); } }
</style>
</head>
<body>
<div class="mk-d3-door"><i></i></div>
</body>
</html>
