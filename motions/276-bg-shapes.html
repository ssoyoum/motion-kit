<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떠다니는 도형</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 떠다니는 도형 · 도형 5개 · 4~7s alternate */
.mk-bg-shapes {
  position: relative; width: 180px; height: 110px; border-radius: 12px; overflow: hidden;
  background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 8%, var(--mk-surface, #fff));
}
.mk-bg-shapes i { position: absolute; animation: mk-bg-shapes ease-in-out infinite alternate; }
.mk-bg-shapes i:nth-child(1) { left: 12%; top: 18%; width: 26px; height: 26px; border-radius: 50%; background: var(--mk-accent, #2F5BFF); animation-duration: 5s; }
.mk-bg-shapes i:nth-child(2) { left: 62%; top: 12%; width: 24px; height: 22px; background: var(--mk-warn, #D99A00); clip-path: polygon(50% 0, 100% 100%, 0 100%); animation-duration: 6s; }
.mk-bg-shapes i:nth-child(3) { left: 40%; top: 58%; width: 20px; height: 20px; border-radius: 4px; background: var(--mk-success, #1F9D55); animation-duration: 4s; }
.mk-bg-shapes i:nth-child(4) { left: 78%; top: 60%; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--mk-danger, #E5484D); animation-duration: 7s; }
.mk-bg-shapes i:nth-child(5) { left: 22%; top: 70%; width: 10px; height: 10px; border-radius: 50%; background: var(--mk-accent, #2F5BFF); opacity: .5; animation-duration: 4.5s; }
@keyframes mk-bg-shapes { to { transform: translate(14px, -12px) rotate(90deg); } }
</style>
</head>
<body>
<div class="mk-bg-shapes"><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
