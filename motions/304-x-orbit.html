<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도는 아이콘 궤도</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 도는 아이콘 궤도 · 10s · linear · ∞ · 안쪽·바깥 반대 방향 */
.mk-x-orbit { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
.mk-x-orbit b { color: var(--mk-accent, #2F5BFF); font-size: 20px; }
.mk-x-orbit div { position: absolute; border-radius: 50%; border: 1px dashed var(--mk-line, #DCE0EA); animation: mk-x-orbit 10s linear infinite; }
.mk-x-orbit .a { inset: 34px; }
.mk-x-orbit .b { inset: 0; animation-direction: reverse; animation-duration: 16s; }
.mk-x-orbit i { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; display: grid; place-items: center; border-radius: 50%; background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); color: var(--mk-ink, #1B1E26); font: 700 10px system-ui, sans-serif; font-style: normal; animation: mk-x-orbit 10s linear infinite reverse; }
.mk-x-orbit .b i { animation-direction: normal; animation-duration: 16s; }
.mk-x-orbit .a i:nth-child(1) { top: 0; left: 50%; } .mk-x-orbit .a i:nth-child(2) { top: 75%; left: 93%; } .mk-x-orbit .a i:nth-child(3) { top: 75%; left: 7%; }
.mk-x-orbit .b i:nth-child(1) { top: 0; left: 50%; } .mk-x-orbit .b i:nth-child(2) { top: 50%; left: 100%; } .mk-x-orbit .b i:nth-child(3) { top: 100%; left: 50%; } .mk-x-orbit .b i:nth-child(4) { top: 50%; left: 0; }
@keyframes mk-x-orbit { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="mk-x-orbit"><b>●</b><div class="a"><i>A</i><i>B</i><i>C</i></div><div class="b"><i>D</i><i>E</i><i>F</i><i>G</i></div></div>
</body>
</html>
