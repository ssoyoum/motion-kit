<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누적 막대 쌓기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 누적 막대 쌓기 · 3.2s · 칸마다 0.15s, 막대마다 0.08s */
.mk-ch-stack { display: flex; align-items: flex-end; gap: 10px; height: 90px; border-bottom: 1px solid var(--mk-ink-soft, #8A90A0); }
.mk-ch-stack > div { display: flex; flex-direction: column-reverse; width: 22px; }
.mk-ch-stack i { display: block; height: 0; animation: mk-ch-stack 3.2s cubic-bezier(.2, .8, .2, 1) infinite; }
.mk-ch-stack i:nth-child(1) { background: var(--mk-accent, #2F5BFF); }
.mk-ch-stack i:nth-child(2) { background: var(--mk-success, #1F9D55); }
.mk-ch-stack i:nth-child(3) { background: var(--mk-warn, #D99A00); border-radius: 3px 3px 0 0; }
.mk-ch-stack > div:nth-child(1) i:nth-child(1) { --h: 30px; animation-delay: 0.00s; }
.mk-ch-stack > div:nth-child(1) i:nth-child(2) { --h: 20px; animation-delay: 0.15s; }
.mk-ch-stack > div:nth-child(1) i:nth-child(3) { --h: 12px; animation-delay: 0.30s; }
.mk-ch-stack > div:nth-child(2) i:nth-child(1) { --h: 24px; animation-delay: 0.08s; }
.mk-ch-stack > div:nth-child(2) i:nth-child(2) { --h: 28px; animation-delay: 0.23s; }
.mk-ch-stack > div:nth-child(2) i:nth-child(3) { --h: 18px; animation-delay: 0.38s; }
.mk-ch-stack > div:nth-child(3) i:nth-child(1) { --h: 36px; animation-delay: 0.16s; }
.mk-ch-stack > div:nth-child(3) i:nth-child(2) { --h: 16px; animation-delay: 0.31s; }
.mk-ch-stack > div:nth-child(3) i:nth-child(3) { --h: 22px; animation-delay: 0.46s; }
.mk-ch-stack > div:nth-child(4) i:nth-child(1) { --h: 20px; animation-delay: 0.24s; }
.mk-ch-stack > div:nth-child(4) i:nth-child(2) { --h: 30px; animation-delay: 0.39s; }
.mk-ch-stack > div:nth-child(4) i:nth-child(3) { --h: 26px; animation-delay: 0.54s; }
@keyframes mk-ch-stack { 0% { height: 0; } 30%, 85% { height: var(--h); } 100% { height: 0; } }
</style>
</head>
<body>
<div class="mk-ch-stack"><div><i></i><i></i><i></i></div><div><i></i><i></i><i></i></div><div><i></i><i></i><i></i></div><div><i></i><i></i><i></i></div></div>
</body>
</html>
