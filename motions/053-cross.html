<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실패 X</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 실패 X · 2.4s · 선 2개 동시 */
.mk-cross { width: 52px; height: 52px; }
.mk-cross circle, .mk-cross path {
  fill: none; stroke: var(--mk-danger, #E5484D); stroke-width: 3; stroke-linecap: round;
}
.mk-cross circle { stroke-dasharray: 151; animation: mk-cross-c 2.4s ease-out infinite; }
.mk-cross path   { stroke-dasharray: 23;  animation: mk-cross-p 2.4s ease-out infinite; }
@keyframes mk-cross-c {
  0% { stroke-dashoffset: 151; opacity: 1; }
  30%, 90% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes mk-cross-p {
  0%, 30% { stroke-dashoffset: 23; opacity: 1; }
  45%, 90% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
</style>
</head>
<body>
<svg class="mk-cross" viewBox="0 0 52 52" aria-label="실패"><circle cx="26" cy="26" r="24"/><path d="M18 18l16 16M34 18L18 34"/></svg>
</body>
</html>
