<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좋아요</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 좋아요 · 1.6s · scale 0.7→1.2 + 고리 */
.mk-heart { position: relative; width: 40px; height: 40px; }
.mk-heart svg { width: 100%; height: 100%; fill: var(--mk-danger, #E5484D); animation: mk-heart 1.6s infinite; }
.mk-heart::before {
  content: ""; position: absolute; inset: -6px; border-radius: 50%; opacity: 0;
  border: 2px solid var(--mk-danger, #E5484D); animation: mk-heart-r 1.6s infinite;
}
@keyframes mk-heart { 0%, 45%, 100% { transform: scale(1); } 15% { transform: scale(.7); } 30% { transform: scale(1.2); } }
@keyframes mk-heart-r { 0%, 15% { transform: scale(.6); opacity: 0; } 25% { opacity: .8; } 60%, 100% { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>
<div class="mk-heart"><svg viewBox="0 0 24 24" aria-label="좋아요"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
</body>
</html>
