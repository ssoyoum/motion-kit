<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기여도 분해 쌓기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 기여도 분해 쌓기 · 3.6s · 16주 막대 0.05s 간격 */
.mk-an-attrib { display: grid; gap: 6px; }
.mk-an-attrib ul { display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; font: 500 9px system-ui, sans-serif; color: var(--mk-ink-soft, #8A90A0); }
.mk-an-attrib li::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 3px; border-radius: 2px; background: var(--c); }
.mk-an-attrib > div { display: flex; align-items: flex-end; gap: 3px; height: 92px; border-bottom: 1px solid var(--mk-ink-soft, #8A90A0); }
.mk-an-attrib p { display: flex; flex-direction: column-reverse; width: 9px; margin: 0; transform-origin: bottom; animation: mk-an-attrib 3.6s cubic-bezier(.2, .8, .2, 1) var(--d) infinite both; }
.mk-an-attrib i { display: block; background: var(--c); }
.mk-an-attrib :is(li, i):nth-child(1) { --c: color-mix(in srgb, var(--mk-ink-soft, #8A90A0) 35%, transparent); }
.mk-an-attrib :is(li, i):nth-child(2) { --c: var(--mk-ink-soft, #8A90A0); }
.mk-an-attrib :is(li, i):nth-child(3) { --c: var(--mk-accent, #2F5BFF); }
.mk-an-attrib :is(li, i):nth-child(4) { --c: var(--mk-ink, #1B1E26); }
.mk-an-attrib i:nth-child(4) { border-radius: 2px 2px 0 0; }
@keyframes mk-an-attrib { 0% { transform: scaleY(0); opacity: 1; } 30%, 88% { transform: none; opacity: 1; } 100% { transform: none; opacity: 0; } }
</style>
</head>
<body>
<div class="mk-an-attrib"><ul><li>기본</li><li>검색</li><li>PMax</li><li>메타</li></ul><div><p style="--d:0.00s"><i style="height:39px"></i><i style="height:11px"></i><i style="height:14px"></i><i style="height:8px"></i></p><p style="--d:0.05s"><i style="height:41px"></i><i style="height:12px"></i><i style="height:14px"></i><i style="height:8px"></i></p><p style="--d:0.10s"><i style="height:40px"></i><i style="height:13px"></i><i style="height:15px"></i><i style="height:9px"></i></p><p style="--d:0.15s"><i style="height:39px"></i><i style="height:14px"></i><i style="height:14px"></i><i style="height:6px"></i></p><p style="--d:0.20s"><i style="height:42px"></i><i style="height:14px"></i><i style="height:16px"></i><i style="height:7px"></i></p><p style="--d:0.25s"><i style="height:39px"></i><i style="height:12px"></i><i style="height:16px"></i><i style="height:8px"></i></p><p style="--d:0.30s"><i style="height:41px"></i><i style="height:12px"></i><i style="height:14px"></i><i style="height:9px"></i></p><p style="--d:0.35s"><i style="height:38px"></i><i style="height:14px"></i><i style="height:15px"></i><i style="height:8px"></i></p><p style="--d:0.40s"><i style="height:39px"></i><i style="height:13px"></i><i style="height:13px"></i><i style="height:8px"></i></p><p style="--d:0.45s"><i style="height:39px"></i><i style="height:10px"></i><i style="height:16px"></i><i style="height:7px"></i></p><p style="--d:0.50s"><i style="height:42px"></i><i style="height:15px"></i><i style="height:17px"></i><i style="height:7px"></i></p><p style="--d:0.55s"><i style="height:39px"></i><i style="height:15px"></i><i style="height:16px"></i><i style="height:9px"></i></p><p style="--d:0.60s"><i style="height:40px"></i><i style="height:12px"></i><i style="height:20px"></i><i style="height:6px"></i></p><p style="--d:0.65s"><i style="height:38px"></i><i style="height:16px"></i><i style="height:20px"></i><i style="height:9px"></i></p><p style="--d:0.70s"><i style="height:40px"></i><i style="height:16px"></i><i style="height:22px"></i><i style="height:6px"></i></p><p style="--d:0.75s"><i style="height:39px"></i><i style="height:16px"></i><i style="height:23px"></i><i style="height:10px"></i></p></div></div>
</body>
</html>
