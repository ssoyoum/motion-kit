<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도리도리</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 도리도리 · 2s · 0.8s 동안 4번 흔듦 */
.mk-a-headshake {
  position: relative; width: 56px; height: 56px; border-radius: 50%;
  background: var(--mk-warn, #D99A00); animation: mk-a-headshake 2s ease-in-out infinite;
}
.mk-a-headshake i { position: absolute; top: 20px; width: 6px; height: 8px; border-radius: 3px; background: #1B1E26; }
.mk-a-headshake i:first-child { left: 17px; }
.mk-a-headshake i:nth-child(2) { right: 17px; }
.mk-a-headshake b { position: absolute; left: 20px; right: 20px; bottom: 15px; height: 3px; border-radius: 2px; background: #1B1E26; }
@keyframes mk-a-headshake {
  0%, 50%, 100% { transform: none; }
  10% { transform: translateX(-6px) rotate(-6deg); }
  20% { transform: translateX(5px) rotate(5deg); }
  30% { transform: translateX(-4px) rotate(-3deg); }
  40% { transform: translateX(2px) rotate(2deg); }
}
</style>
</head>
<body>
<div class="mk-a-headshake" aria-label="아니요"><i></i><i></i><b></b></div>
</body>
</html>
