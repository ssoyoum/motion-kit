<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잠금 해제</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 잠금 해제 · 2.8s · 고리 들림 → 초록으로 */
.mk-ic-lock { width: 44px; height: 44px; overflow: visible; }
.mk-ic-lock .sh { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 2; stroke-linecap: round; transform-origin: 8px 11px; animation: mk-ic-lock-sh 2.8s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-ic-lock .bd { fill: var(--mk-ink, #1B1E26); animation: mk-ic-lock-bd 2.8s infinite; }
.mk-ic-lock .kh { fill: var(--mk-surface, #fff); }
@keyframes mk-ic-lock-sh { 0%, 30%, 92%, 100% { transform: none; } 40% { transform: translateY(-2px); } 50%, 85% { transform: translateY(-2px) rotate(-35deg); } }
@keyframes mk-ic-lock-bd { 0%, 40%, 95%, 100% { fill: var(--mk-ink, #1B1E26); } 50%, 88% { fill: var(--mk-success, #1F9D55); } }
</style>
</head>
<body>
<svg class="mk-ic-lock" viewBox="0 0 24 24" aria-label="잠금 해제"><path class="sh" d="M8 11V7a4 4 0 0 1 8 0v4"/><rect class="bd" x="5" y="11" width="14" height="10" rx="2"/><circle class="kh" cx="12" cy="16" r="1.5"/></svg>
</body>
</html>
