<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입력 오류 문구</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 입력 오류 문구 · 3s · 테두리 빨강 + 문구 내려옴 */
.mk-fb-inputerr { display: grid; gap: 5px; width: 180px; }
.mk-fb-inputerr input {
  padding: 8px 10px; border-radius: 8px; font: inherit; background: transparent; color: inherit;
  border: 1.5px solid var(--mk-line, #DCE0EA); animation: mk-fb-inputerr-b 3s infinite;
}
.mk-fb-inputerr p { margin: 0; font-size: 12px; color: var(--mk-danger, #E5484D); animation: mk-fb-inputerr-m 3s cubic-bezier(.2, .8, .2, 1) infinite; }
@keyframes mk-fb-inputerr-b { 0%, 20%, 100% { border-color: var(--mk-line, #DCE0EA); } 30%, 85% { border-color: var(--mk-danger, #E5484D); } }
@keyframes mk-fb-inputerr-m { 0%, 20% { opacity: 0; transform: translateY(-6px); } 30%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-fb-inputerr"><input value="abc@" aria-label="이메일" readonly><p>이메일 형식이 아니에요</p></div>
</body>
</html>
