<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돌아가는 시계</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 돌아가는 시계 · 분침 4s · 시침 48s 한 바퀴 */
.mk-il-clock { width: 190px; height: 105px; }
.mk-il-clock .face { fill: var(--mk-surface, #fff); stroke: var(--mk-ink, #1B1E26); stroke-width: 4; }
.mk-il-clock .ticks line { stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 2; stroke-linecap: round; }
.mk-il-clock .hr, .mk-il-clock .mn { stroke-linecap: round; transform-origin: 100px 55px; animation: mk-il-clock 4s linear infinite; }
.mk-il-clock .hr { stroke: var(--mk-ink, #1B1E26); stroke-width: 4; animation-duration: 48s; }
.mk-il-clock .mn { stroke: var(--mk-accent, #2F5BFF); stroke-width: 3; }
.mk-il-clock .dot { fill: var(--mk-accent, #2F5BFF); }
@keyframes mk-il-clock { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<svg class="mk-il-clock" viewBox="0 0 200 110">
  <circle class="face" cx="100" cy="55" r="42"/>
  <g class="ticks"><line x1="100" y1="19" x2="100" y2="26" transform="rotate(0 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(30 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(60 100 55)"/>
<line x1="100" y1="19" x2="100" y2="26" transform="rotate(90 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(120 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(150 100 55)"/>
<line x1="100" y1="19" x2="100" y2="26" transform="rotate(180 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(210 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(240 100 55)"/>
<line x1="100" y1="19" x2="100" y2="26" transform="rotate(270 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(300 100 55)"/>
<line x1="100" y1="19" x2="100" y2="23" transform="rotate(330 100 55)"/></g>
  <line class="hr" x1="100" y1="55" x2="100" y2="34"/>
  <line class="mn" x1="100" y1="55" x2="100" y2="23"/>
  <circle class="dot" cx="100" cy="55" r="3.5"/>
</svg>
</body>
</html>
