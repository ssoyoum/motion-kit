<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신호 잡기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 신호 잡기 · 1.6s · 호 3개 0.2s씩 */
.mk-wifi { width: 44px; height: 44px; fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 2; stroke-linecap: round; }
.mk-wifi circle { fill: var(--mk-accent, #2F5BFF); stroke: none; }
.mk-wifi path { opacity: .15; animation: mk-wifi 1.6s infinite; }
.mk-wifi path:nth-of-type(2) { animation-delay: .2s; }
.mk-wifi path:nth-of-type(3) { animation-delay: .4s; }
@keyframes mk-wifi { 0%, 20% { opacity: .15; } 40%, 80% { opacity: 1; } 100% { opacity: .15; } }
</style>
</head>
<body>
<svg class="mk-wifi" viewBox="0 0 24 24"><circle cx="12" cy="18" r="1.6"/><path d="M8.5 14.5a5 5 0 0 1 7 0"/><path d="M5.5 11.5a9 9 0 0 1 13 0"/><path d="M2.5 8.5a13 13 0 0 1 19 0"/></svg>
</body>
</html>
