<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈 깜빡 · 가리기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 눈 깜빡 · 가리기 · 3s · 깜빡 → 사선 긋기 */
.mk-ic-eye { width: 44px; height: 44px; overflow: visible; }
.mk-ic-eye .ey { transform-box: fill-box; transform-origin: center; animation: mk-ic-eye-blink 3s infinite; }
.mk-ic-eye .ey path { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 1.8; stroke-linejoin: round; }
.mk-ic-eye .ey circle { fill: var(--mk-ink, #1B1E26); }
.mk-ic-eye .sl { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 23; stroke-dashoffset: 23; animation: mk-ic-eye-slash 3s infinite; }
@keyframes mk-ic-eye-blink { 0%, 40%, 50%, 100% { transform: none; } 45% { transform: scaleY(.1); } }
@keyframes mk-ic-eye-slash { 0%, 55% { stroke-dashoffset: 23; } 70%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 23; } }
</style>
</head>
<body>
<svg class="mk-ic-eye" viewBox="0 0 24 24" aria-label="비밀번호 보기"><g class="ey"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><path class="sl" d="M4 4l16 16"/></svg>
</body>
</html>
