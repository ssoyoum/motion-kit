<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웃는 해</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 웃는 해 · 빛살 10s 회전 · 얼굴 2s 숨쉬기 */
.mk-il-sun { width: 190px; height: 105px; }
.mk-il-sun .rays { transform-origin: 100px 55px; animation: mk-il-sun-rot 10s linear infinite; }
.mk-il-sun .rays line { stroke: var(--mk-warn, #D99A00); stroke-width: 5; stroke-linecap: round; }
.mk-il-sun .core { transform-box: fill-box; transform-origin: center; animation: mk-il-sun-core 2s ease-in-out infinite alternate; }
.mk-il-sun .core > circle:first-child { fill: var(--mk-warn, #D99A00); }
.mk-il-sun .f { fill: color-mix(in srgb, var(--mk-warn, #D99A00) 45%, #000); }
.mk-il-sun .m { fill: none; stroke: color-mix(in srgb, var(--mk-warn, #D99A00) 45%, #000); stroke-width: 2.4; stroke-linecap: round; }
@keyframes mk-il-sun-rot { to { transform: rotate(360deg); } }
@keyframes mk-il-sun-core { to { transform: scale(1.07); } }
</style>
</head>
<body>
<svg class="mk-il-sun" viewBox="0 0 200 110">
  <g class="rays"><line x1="100" y1="12" x2="100" y2="24" transform="rotate(0 100 55)"/>
<line x1="100" y1="12" x2="100" y2="24" transform="rotate(45 100 55)"/>
<line x1="100" y1="12" x2="100" y2="24" transform="rotate(90 100 55)"/>
<line x1="100" y1="12" x2="100" y2="24" transform="rotate(135 100 55)"/>
<line x1="100" y1="12" x2="100" y2="24" transform="rotate(180 100 55)"/>
<line x1="100" y1="12" x2="100" y2="24" transform="rotate(225 100 55)"/>
<line x1="100" y1="12" x2="100" y2="24" transform="rotate(270 100 55)"/>
<line x1="100" y1="12" x2="100" y2="24" transform="rotate(315 100 55)"/></g>
  <g class="core"><circle cx="100" cy="55" r="24"/><circle class="f" cx="92" cy="51" r="2.2"/><circle class="f" cx="108" cy="51" r="2.2"/><path class="m" d="M91 60q9 7 18 0"/></g>
</svg>
</body>
</html>
