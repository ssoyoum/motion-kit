<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스트리밍 응답</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 스트리밍 응답 · 단어당 0.25s 지연 · 커서 0.8s step-end */
.mk-stream { margin: 0; font-size: 15px; }
.mk-stream span { opacity: 0; animation: mk-stream 3s infinite; }
.mk-stream span:nth-child(2) { animation-delay: .25s; }
.mk-stream span:nth-child(3) { animation-delay: .5s; }
.mk-stream span:nth-child(4) { animation-delay: .75s; }
.mk-stream b {
  display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -2px;
  background: var(--mk-accent, #2F5BFF); animation: mk-caret .8s step-end infinite;
}
@keyframes mk-stream { 0% { opacity: 0; } 8%, 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes mk-caret { 50% { opacity: 0; } }
</style>
</head>
<body>
<p class="mk-stream"><span>배송은</span> <span>내일</span> <span>도착</span> <span>예정입니다</span><b></b></p>
</body>
</html>
