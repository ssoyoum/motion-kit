<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굴러가는 숫자판</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 굴러가는 숫자판 · 자리마다 0~9 띠 · 0.8s 이동 · 1.6s마다 증가 */
.mk-js-odometer { display: flex; gap: 3px; font: 800 30px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--mk-ink, #1B1E26); }
.mk-js-odometer .d {
  width: .7em; height: 1.2em; overflow: hidden; border-radius: 6px;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
}
.mk-js-odometer .d span { display: block; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
.mk-js-odometer .d i { display: block; height: 1.2em; line-height: 1.2em; font-style: normal; text-align: center; }
@media (prefers-reduced-motion: reduce) { .mk-js-odometer .d span { transition: none; } }
</style>
</head>
<body>
<div class="mk-js-odometer" role="img" aria-label="오늘 방문자 수"></div>
<script>
document.querySelectorAll(".mk-js-odometer").forEach(function (root) {
var n = 48210, cols = [];
for (var c = 0; c < 6; c++) {
  var d = document.createElement("div"), s = document.createElement("span");
  d.className = "d";
  for (var k = 0; k < 10; k++) { var i = document.createElement("i"); i.textContent = k; s.appendChild(i); }
  d.appendChild(s); root.appendChild(d); cols.push(s);
}
function show() {
  String(n).padStart(6, "0").split("").forEach(function (ch, idx) {
    cols[idx].style.transform = "translateY(" + (-1.2 * +ch) + "em)";
  });
  root.setAttribute("aria-label", "오늘 방문자 " + n.toLocaleString("ko-KR") + "명");
}
show();
var timer = setInterval(function () {
  if (!root.isConnected) return clearInterval(timer);
  n += 1 + Math.floor(Math.random() * 380);
  show();
}, 1600);
});
</script>
</body>
</html>
