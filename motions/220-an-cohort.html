<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코호트 리텐션 채우기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 코호트 리텐션 채우기 · 4.5s · 열마다 0.12s 계단 + 강조 칸 맥박 */
.mk-an-cohort { display: grid; grid-template-columns: 26px repeat(6, 26px); gap: 2px; font: 600 9px/17px system-ui, sans-serif; text-align: center; font-variant-numeric: tabular-nums; }
.mk-an-cohort b { font-weight: 500; color: var(--mk-ink-soft, #8A90A0); line-height: 12px; }
.mk-an-cohort b:nth-child(n+8) { line-height: 17px; text-align: right; padding-right: 3px; }
.mk-an-cohort i { font-style: normal; border-radius: 3px; color: var(--mk-ink, #1B1E26); background: color-mix(in srgb, var(--mk-accent, #2F5BFF) var(--a, 0%), transparent); animation: mk-an-cohort 4.5s cubic-bezier(.2, .8, .2, 1) var(--d, 0s) infinite both; }
.mk-an-cohort i:empty { visibility: hidden; }
.mk-an-cohort i.z { background: var(--mk-skel-a, #E0E4EC); }
.mk-an-cohort i.hl { background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); animation: mk-an-cohort 4.5s cubic-bezier(.2, .8, .2, 1) var(--d) infinite both, mk-an-cohort-hl 4.5s var(--d) infinite both; }
@keyframes mk-an-cohort { 0% { opacity: 0; transform: scale(.4); } 12%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
@keyframes mk-an-cohort-hl { 0%, 30%, 88%, 100% { box-shadow: 0 0 0 0 var(--mk-ink, #1B1E26); } 40%, 78% { box-shadow: 0 0 0 2px var(--mk-ink, #1B1E26); } }
</style>
</head>
<body>
<div class="mk-an-cohort"><b></b><b>0</b><b>+1</b><b>+2</b><b>+3</b><b>+4</b><b>+5</b><b>5월</b><i class="z" style="--d:0.00s">100</i><i style="--d:0.12s;--a:71%">35</i><i style="--d:0.24s;--a:53%">24</i><i style="--d:0.36s;--a:49%">21</i><i style="--d:0.48s;--a:39%">15</i><i style="--d:0.60s;--a:33%">11</i><b>6월</b><i class="z" style="--d:0.05s">100</i><i style="--d:0.17s;--a:68%">33</i><i style="--d:0.29s;--a:55%">25</i><i style="--d:0.41s;--a:45%">19</i><i style="--d:0.53s;--a:39%">15</i><i></i><b>7월</b><i class="z" style="--d:0.10s">100</i><i style="--d:0.22s;--a:71%">35</i><i style="--d:0.34s;--a:57%">26</i><i style="--d:0.46s;--a:44%">18</i><i></i><i></i><b>8월</b><i class="z" style="--d:0.15s">100</i><i style="--d:0.27s;--a:73%">36</i><i style="--d:0.39s;--a:58%">27</i><i></i><i></i><i></i><b>9월</b><i class="z" style="--d:0.20s">100</i><i class="hl" style="--d:0.32s;--a:85%">44</i><i></i><i></i><i></i><i></i><b>10월</b><i class="z" style="--d:0.25s">100</i><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
