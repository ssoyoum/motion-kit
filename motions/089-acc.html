<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아코디언</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 아코디언 · 3s · grid-template-rows 0fr→1fr */
.mk-acc { width: 190px; padding: 10px 12px; border: 1px solid var(--mk-line, #DCE0EA); border-radius: 10px; font-size: 13px; }
.mk-acc b { display: block; }
.mk-acc > div { display: grid; grid-template-rows: 0fr; animation: mk-acc 3s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-acc p { margin: 0; min-height: 0; overflow: hidden; color: var(--mk-ink-soft, #8A90A0); }
@keyframes mk-acc { 0%, 15% { grid-template-rows: 0fr; } 35%, 80% { grid-template-rows: 1fr; } 100% { grid-template-rows: 0fr; } }
</style>
</head>
<body>
<div class="mk-acc"><b>배송 안내</b><div><p>주문 후 1~2일 안에 출고돼요.</p></div></div>
</body>
</html>
