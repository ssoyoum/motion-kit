<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 뒤집기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 카드 뒤집기 · 3s · rotateY 0→180→360 */
.mk-flip { width: 90px; height: 60px; perspective: 600px; }
.mk-flip-in {
  position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  animation: mk-flip 3s cubic-bezier(.6, 0, .4, 1) infinite;
}
.mk-flip-in div {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 10px;
  backface-visibility: hidden; font: 700 16px system-ui, sans-serif;
  background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff);
}
.mk-flip-in div:last-child { transform: rotateY(180deg); background: var(--mk-ink, #1B1E26); color: var(--mk-on-ink, #fff); }
@keyframes mk-flip {
  0%, 35% { transform: none; }
  50%, 85% { transform: rotateY(180deg); }
  100% { transform: rotateY(360deg); }
}
</style>
</head>
<body>
<div class="mk-flip"><div class="mk-flip-in"><div>앞</div><div>뒤</div></div></div>
</body>
</html>
