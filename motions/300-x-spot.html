<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스포트라이트 카드</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 스포트라이트 카드 · 마우스를 올려 보세요 · .5s · 빛 번짐 */
.mk-x-spot { position: relative; overflow: hidden; width: 170px; padding: 18px; border: 1px solid var(--mk-line, #DCE0EA); border-radius: 14px; background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 13px system-ui, sans-serif; display: grid; gap: 6px; }
.mk-x-spot::before { content: ""; position: absolute; inset: -40%; background: radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--mk-accent, #2F5BFF) 40%, transparent), transparent 45%); opacity: 0; transform: translate(-20%, -20%); transition: opacity .5s, transform .5s; }
.mk-x-spot:hover::before { opacity: 1; transform: translate(10%, 10%); }
.mk-x-spot:hover { border-color: var(--mk-accent, #2F5BFF); }
.mk-x-spot b, .mk-x-spot span { position: relative; }
.mk-x-spot span { color: var(--mk-ink-soft, #8A90A0); }
</style>
</head>
<body>
<div class="mk-x-spot"><b>빠른 속도</b><span>올려 보세요</span></div>
</body>
</html>
