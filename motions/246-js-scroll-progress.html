<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>읽기 진행 바</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 읽기 진행 바 · scroll 이벤트 · scaleX 0→1 · 스크롤해 보세요 */
.mk-js-scroll-progress {
  position: relative; width: 210px; height: 124px; overflow: hidden; border-radius: 10px;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
}
.mk-js-scroll-progress .bar {
  position: absolute; left: 0; top: 0; z-index: 1; width: 100%; height: 4px;
  background: var(--mk-accent, #2F5BFF); transform: scaleX(0); transform-origin: left;
}
.mk-js-scroll-progress .box { height: 100%; overflow-y: auto; padding: 12px 12px 4px; font-size: 12px; line-height: 1.6; color: var(--mk-ink, #1B1E26); scrollbar-width: thin; }
.mk-js-scroll-progress h4 { margin: 0 0 4px; font-size: 13px; }
.mk-js-scroll-progress p { margin: 0 0 8px; }
</style>
</head>
<body>
<div class="mk-js-scroll-progress">
  <i class="bar"></i>
  <div class="box">
    <h4>배송 안내</h4>
    <p>산지에서 아침에 수확한 상품은 오후 1시에 출고됩니다.</p>
    <p>제주 지역은 하루가 더 걸릴 수 있습니다.</p>
    <p>신선식품은 받으신 날 바로 냉장 보관해 주세요.</p>
    <p>상품에 문제가 있으면 7일 안에 사진과 함께 알려 주세요.</p>
  </div>
</div>
<script>
document.querySelectorAll(".mk-js-scroll-progress").forEach(function (root) {
var box = root.querySelector(".box"), bar = root.querySelector(".bar");
function update() {
  var max = box.scrollHeight - box.clientHeight;
  bar.style.transform = "scaleX(" + (max > 0 ? box.scrollTop / max : 0) + ")";
}
box.addEventListener("scroll", update, { passive: true });
update();
});
</script>
</body>
</html>
