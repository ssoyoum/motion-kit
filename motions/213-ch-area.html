<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영역 차트 차오름</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 영역 차트 차오름 · 3s · scaleY 0→1 아래 기준 */
.mk-ch-area { width: 180px; height: 90px; overflow: visible; }
.mk-ch-area g { transform-box: fill-box; transform-origin: 50% 100%; animation: mk-ch-area 3s cubic-bezier(.2, .8, .2, 1) infinite; }
.mk-ch-area g path:first-child { fill: color-mix(in srgb, var(--mk-accent, #2F5BFF) 25%, transparent); }
.mk-ch-area g path:last-child { fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.mk-ch-area > path { fill: none; stroke: var(--mk-ink-soft, #8A90A0); stroke-width: 1; }
@keyframes mk-ch-area { 0% { transform: scaleY(0); } 35%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
</style>
</head>
<body>
<svg class="mk-ch-area" viewBox="0 0 160 80"><g><path d="M0 80V55L25 48L50 52L75 30L100 36L125 18L160 24V80Z"/><path d="M0 55L25 48L50 52L75 30L100 36L125 18L160 24"/></g><path d="M0 79.5H160"/></svg>
</body>
</html>
