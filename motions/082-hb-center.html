<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가운데서 채우기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 가운데서 채우기 · 0.35s · scaleX 0→1 · 마우스를 올려 보세요 */
.mk-hb-center {
  position: relative; isolation: isolate; overflow: hidden; padding: 10px 20px; cursor: pointer;
  border: 2px solid var(--mk-ink, #1B1E26); border-radius: 10px; background: transparent;
  color: var(--mk-ink, #1B1E26); font: 700 14px system-ui, sans-serif; transition: color .35s;
}
.mk-hb-center::before {
  content: ""; position: absolute; inset: 0; z-index: -1; background: var(--mk-ink, #1B1E26);
  transform: scaleX(0); transition: transform .35s cubic-bezier(.6, 0, .2, 1);
}
.mk-hb-center:hover, .mk-hb-center:focus-visible { color: var(--mk-on-ink, #fff); }
.mk-hb-center:hover::before, .mk-hb-center:focus-visible::before { transform: scaleX(1); }
</style>
</head>
<body>
<button class="mk-hb-center" type="button">더 알아보기</button>
</body>
</html>
