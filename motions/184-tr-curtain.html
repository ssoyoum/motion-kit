<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커튼 열림</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 커튼 열림 · 4s · 양쪽으로 100% 이동 */
.mk-tr-curtain {
  position: relative; display: grid; place-items: center; width: 160px; height: 100px; border-radius: 12px; overflow: hidden;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
}
.mk-tr-curtain p { margin: 0; font: 800 16px system-ui, sans-serif; }
.mk-tr-curtain i {
  position: absolute; top: 0; bottom: 0; width: 50%;
  background: repeating-linear-gradient(90deg, var(--mk-danger, #E5484D) 0 8px, color-mix(in srgb, var(--mk-danger, #E5484D) 78%, #000) 8px 12px);
  animation: mk-tr-curtain 4s cubic-bezier(.7, 0, .3, 1) infinite;
}
.mk-tr-curtain i:nth-of-type(1) { left: 0; --mk-tr-curtain-d: -100%; }
.mk-tr-curtain i:nth-of-type(2) { right: 0; --mk-tr-curtain-d: 100%; }
@keyframes mk-tr-curtain {
  0%, 20% { transform: none; }
  50%, 80% { transform: translateX(var(--mk-tr-curtain-d)); }
  100% { transform: none; }
}
</style>
</head>
<body>
<div class="mk-tr-curtain"><p>신상품 공개</p><i></i><i></i></div>
</body>
</html>
