<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하트 리액션</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 하트 리액션 · 2.4s · 하트 4개 0.4s씩 */
.mk-c-react { position: relative; width: 170px; height: 100px; }
.mk-c-react p { position: absolute; left: 0; bottom: 0; margin: 0; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: var(--mk-bubble, #E3E7F0); font-size: 13px; }
.mk-c-react span { position: absolute; right: 18px; bottom: 26px; color: var(--mk-danger, #E5484D); font-size: 16px; opacity: 0; animation: mk-c-react 2.4s ease-out infinite; }
.mk-c-react span:nth-of-type(1) { --x: -14px; animation-delay: 0.0s; }
.mk-c-react span:nth-of-type(2) { --x: 10px; animation-delay: 0.4s; }
.mk-c-react span:nth-of-type(3) { --x: -4px; animation-delay: 0.8s; }
.mk-c-react span:nth-of-type(4) { --x: 16px; animation-delay: 1.2s; }
@keyframes mk-c-react {
  0% { transform: translate(0, 0) scale(.6); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate(var(--x), -70px) scale(1.1); opacity: 0; }
}
</style>
</head>
<body>
<div class="mk-c-react"><p>오늘 수확한 망고예요</p><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
</body>
</html>
