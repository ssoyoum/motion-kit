<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>따라 기우는 카드</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 따라 기우는 카드 · ±12° 기울기 + 빛 반사 · 마우스를 올려 보세요 */
.mk-js-tilt { width: 220px; height: 124px; display: grid; place-items: center; perspective: 600px; }
.mk-js-tilt .card {
  position: relative; overflow: hidden; width: 170px; height: 100px; padding: 14px; border-radius: 14px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
  background: linear-gradient(135deg, var(--mk-accent, #2F5BFF), #1B1E26); color: #fff;
  box-shadow: 0 12px 24px rgb(0 0 0 / .25); transition: transform .2s ease-out;
}
.mk-js-tilt b { font: 800 15px system-ui, sans-serif; }
.mk-js-tilt small { font-size: 11px; opacity: .8; }
.mk-js-tilt .glare {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgb(255 255 255 / .45), transparent 55%);
}
.mk-js-tilt.on .glare { opacity: 1; }
.mk-js-tilt:not(.on) .card { animation: mk-js-tilt-sway 4s ease-in-out infinite; }
@keyframes mk-js-tilt-sway {
  0%, 100% { transform: rotateY(-10deg) rotateX(6deg); }
  50% { transform: rotateY(10deg) rotateX(-6deg); }
}
</style>
</head>
<body>
<div class="mk-js-tilt"><div class="card"><b>VIP 멤버십</b><small>2026 · 교동마을</small><i class="glare"></i></div></div>
<script>
document.querySelectorAll(".mk-js-tilt").forEach(function (root) {
var c = root.querySelector(".card");
root.addEventListener("pointermove", function (e) {
  var r = c.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  c.style.transform = "rotateY(" + (px - 0.5) * 24 + "deg) rotateX(" + (0.5 - py) * 20 + "deg)";
  c.style.setProperty("--gx", px * 100 + "%");
  c.style.setProperty("--gy", py * 100 + "%");
  root.classList.add("on");
});
root.addEventListener("pointerleave", function () { c.style.transform = ""; root.classList.remove("on"); });
});
</script>
</body>
</html>
