<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떠오르는 상품 카드</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 떠오르는 상품 카드 · 0.25s · -6px + 그림자 · 마우스를 올려 보세요 */
.mk-cd-lift {
  width: 150px; overflow: hidden; border-radius: 12px; cursor: pointer;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA);
  transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s;
}
.mk-cd-lift div { height: 64px; background: linear-gradient(135deg, var(--mk-warn, #D99A00), var(--mk-danger, #E5484D)); }
.mk-cd-lift p { margin: 0; padding: 8px 10px; display: grid; font: 600 12px/1.4 system-ui, sans-serif; }
.mk-cd-lift b { color: var(--mk-accent, #2F5BFF); }
.mk-cd-lift:hover, .mk-cd-lift:focus-visible { transform: translateY(-6px); box-shadow: 0 12px 24px rgb(0 0 0 / .15); }
</style>
</head>
<body>
<article class="mk-cd-lift" tabindex="0"><div></div><p>제주 한라봉 3kg<b>29,900원</b></p></article>
</body>
</html>
