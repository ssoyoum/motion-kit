<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로고 와이프</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 로고 와이프 · 3.2s · 덮고 → 걷히며 드러남 */
.mk-wipe { position: relative; display: inline-block; font: 900 24px system-ui, sans-serif; letter-spacing: .04em; }
.mk-wipe span { animation: mk-wipe-t 3.2s infinite; }
.mk-wipe::after { content: ""; position: absolute; inset: 0; background: var(--mk-accent, #2F5BFF); transform: scaleX(0); transform-origin: left; animation: mk-wipe-b 3.2s cubic-bezier(.7, 0, .3, 1) infinite; }
@keyframes mk-wipe-b {
  0% { transform: scaleX(0); transform-origin: left; }
  25% { transform: scaleX(1); transform-origin: left; }
  25.1% { transform: scaleX(1); transform-origin: right; }
  50%, 100% { transform: scaleX(0); transform-origin: right; }
}
@keyframes mk-wipe-t { 0%, 25% { opacity: 0; } 25.1%, 90% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mk-wipe"><span>교동마을</span></div>
</body>
</html>
