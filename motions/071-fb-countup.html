<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장바구니 수 증가</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 장바구니 수 증가 · 3s · 1→2→3 · 매초 튕김 */
@property --mk-fb-countup-n { syntax: "<integer>"; initial-value: 1; inherits: false; }
.mk-fb-countup { position: relative; width: 40px; height: 40px; }
.mk-fb-countup svg { width: 100%; height: 100%; fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mk-fb-countup b {
  position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--mk-danger, #E5484D); color: #fff; font: 700 11px/18px system-ui, sans-serif; text-align: center;
  counter-reset: mk-fb-countup var(--mk-fb-countup-n);
  animation: mk-fb-countup 3s step-end infinite, mk-fb-countup-p 1s infinite;
}
.mk-fb-countup b::after { content: counter(mk-fb-countup); }
@keyframes mk-fb-countup { 0% { --mk-fb-countup-n: 1; } 33.33% { --mk-fb-countup-n: 2; } 66.66% { --mk-fb-countup-n: 3; } 100% { --mk-fb-countup-n: 3; } }
@keyframes mk-fb-countup-p { 0% { transform: scale(1.35); } 20%, 100% { transform: none; } }
</style>
</head>
<body>
<div class="mk-fb-countup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L19 8H6"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><b></b></div>
</body>
</html>
