<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원근 격자 바닥</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 원근 격자 바닥 · 1s · linear · 20px 격자 */
.mk-bg-floor {
  position: relative; width: 180px; height: 110px; border-radius: 12px; overflow: hidden;
  background: linear-gradient(#0B1020 45%, #1A2550);
}
.mk-bg-floor::before {
  content: ""; position: absolute; left: -50%; right: -50%; top: 45%; height: 200%;
  background-image:
    linear-gradient(color-mix(in srgb, var(--mk-accent, #2F5BFF) 75%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--mk-accent, #2F5BFF) 75%, transparent) 1px, transparent 1px);
  background-size: 20px 20px;
  transform: perspective(120px) rotateX(60deg); transform-origin: top;
  animation: mk-bg-floor 1s linear infinite;
}
@keyframes mk-bg-floor { to { background-position: 0 20px; } }
</style>
</head>
<body>
<div class="mk-bg-floor"></div>
</body>
</html>
