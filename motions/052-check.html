<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체크 그리기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 체크 그리기 · 2.4s · stroke-dashoffset 151→0 */
.mk-check { width: 52px; height: 52px; }
.mk-check circle, .mk-check path {
  fill: none; stroke: var(--mk-success, #1F9D55); stroke-width: 3;
  stroke-linecap: round; stroke-linejoin: round;
}
.mk-check circle { stroke-dasharray: 151; animation: mk-check-c 2.4s ease-out infinite; }
.mk-check path   { stroke-dasharray: 32;  animation: mk-check-p 2.4s ease-out infinite; }
@keyframes mk-check-c {
  0% { stroke-dashoffset: 151; opacity: 1; }
  30%, 90% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes mk-check-p {
  0%, 30% { stroke-dashoffset: 32; opacity: 1; }
  50%, 90% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
</style>
</head>
<body>
<svg class="mk-check" viewBox="0 0 52 52" aria-label="완료"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>
</body>
</html>
