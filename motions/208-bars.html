<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>막대 자라기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 막대 자라기 · 3s · 막대당 0.08s */
.mk-bars { display: flex; align-items: flex-end; gap: 8px; height: 70px; border-bottom: 1px solid var(--mk-ink-soft, #8A90A0); }
.mk-bars i { width: 14px; border-radius: 3px 3px 0 0; background: var(--mk-accent, #2F5BFF); transform-origin: bottom; animation: mk-bars 3s cubic-bezier(.2, .8, .2, 1) infinite; }
.mk-bars i:nth-child(1) { height: 40%; animation-delay: 0.00s; }
.mk-bars i:nth-child(2) { height: 65%; animation-delay: 0.08s; }
.mk-bars i:nth-child(3) { height: 50%; animation-delay: 0.16s; }
.mk-bars i:nth-child(4) { height: 85%; animation-delay: 0.24s; }
.mk-bars i:nth-child(5) { height: 70%; animation-delay: 0.32s; }
@keyframes mk-bars { 0% { transform: scaleY(0); } 25%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
</style>
</head>
<body>
<div class="mk-bars"><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
