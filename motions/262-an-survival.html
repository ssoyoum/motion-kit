<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생존 곡선 내려가기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 생존 곡선 내려가기 · 4.4s · 계단 곡선 2개 + 중앙값 표시 */
.mk-an-survival { width: 200px; height: 112px; overflow: visible; }
.mk-an-survival .ax { stroke: var(--mk-skel-a, #E0E4EC); }
.mk-an-survival text { font: 500 9px system-ui, sans-serif; fill: var(--mk-ink-soft, #8A90A0); }
.mk-an-survival .lm { fill: var(--mk-accent, #2F5BFF); font-weight: 700; }
.mk-an-survival .ly { fill: var(--mk-ink, #1B1E26); font-weight: 700; }
.mk-an-survival .y, .mk-an-survival .m { fill: none; stroke-width: 1.8; stroke-dasharray: 1; animation: mk-an-survival 4.4s ease-in-out infinite both; }
.mk-an-survival .y { stroke: var(--mk-ink, #1B1E26); }
.mk-an-survival .m { stroke: var(--mk-accent, #2F5BFF); animation-delay: .15s; }
.mk-an-survival .g { fill: none; stroke: var(--mk-ink-soft, #8A90A0); stroke-dasharray: 2 2; animation: mk-an-survival-g 4.4s infinite both; }
.mk-an-survival circle { fill: var(--mk-accent, #2F5BFF); transform-box: fill-box; transform-origin: center; animation: mk-an-survival-c 4.4s cubic-bezier(.34, 1.56, .64, 1) infinite both; }
@keyframes mk-an-survival { 0% { stroke-dashoffset: 1; opacity: 1; } 45%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes mk-an-survival-g { 0%, 48% { opacity: 0; } 58%, 90% { opacity: 1; } 100% { opacity: 0; } }
@keyframes mk-an-survival-c { 0%, 48% { transform: scale(0); } 58%, 90% { transform: none; opacity: 1; } 100% { transform: none; opacity: 0; } }
</style>
</head>
