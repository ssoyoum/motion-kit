<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>목록 순차 등장</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 목록 순차 등장 · 3s · 줄당 0.1s 지연 */
.mk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 160px; }
.mk-list li {
  height: 12px; border-radius: 6px;
  background: color-mix(in srgb, var(--mk-accent, #2F5BFF) 30%, transparent);
  animation: mk-list 3s cubic-bezier(.2, .8, .2, 1) infinite;
}
.mk-list li:nth-child(2) { width: 80%; animation-delay: .1s; }
.mk-list li:nth-child(3) { width: 90%; animation-delay: .2s; }
.mk-list li:nth-child(4) { width: 60%; animation-delay: .3s; }
@keyframes mk-list {
  0% { transform: translateX(-12px); opacity: 0; }
  15%, 85% { transform: none; opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>
<ul class="mk-list"><li></li><li></li><li></li><li></li></ul>
</body>
</html>
