<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휴지통 열림</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 휴지통 열림 · 2.4s · 뚜껑 -30° 들림 */
.mk-ic-trash { width: 44px; height: 44px; overflow: visible; fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mk-ic-trash .lid { transform-origin: 4px 6px; animation: mk-ic-trash 2.4s cubic-bezier(.4, 0, .2, 1) infinite; }
@keyframes mk-ic-trash { 0%, 25%, 80%, 100% { transform: none; } 35%, 70% { transform: translateY(-1px) rotate(-30deg); } }
</style>
</head>
<body>
<svg class="mk-ic-trash" viewBox="0 0 24 24" aria-label="삭제"><path d="M6 8h12l-1 13H7z"/><path d="M10 11v7M14 11v7"/><g class="lid"><path d="M4 6h16"/><path d="M9 6V4h6v2"/></g></svg>
</body>
</html>
