<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포커스 밑줄</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 포커스 밑줄 · 0.3s · 밑줄 scaleX 0→1 · 클릭해 보세요 */
.mk-f-focusline { position: relative; display: block; width: 180px; }
.mk-f-focusline input {
  width: 100%; box-sizing: border-box; padding: 8px 2px; outline: none; border: 0;
  border-bottom: 1.5px solid var(--mk-line, #DCE0EA); background: transparent; color: inherit; font: 14px system-ui, sans-serif;
}
.mk-f-focusline i {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--mk-accent, #2F5BFF);
  transform: scaleX(0); transition: transform .3s cubic-bezier(.6, 0, .2, 1);
}
.mk-f-focusline input:focus + i { transform: scaleX(1); }
</style>
</head>
<body>
<label class="mk-f-focusline"><input placeholder="닉네임"><i></i></label>
</body>
</html>
