<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퍼지는 물결</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 퍼지는 물결 · 3s · ease-out · ∞ · 동심원 4겹 */
.mk-x-ripple { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
.mk-x-ripple i { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--mk-accent, #2F5BFF); opacity: 0; animation: mk-x-ripple 3s ease-out infinite; }
.mk-x-ripple i:nth-child(2) { animation-delay: .75s; }
.mk-x-ripple i:nth-child(3) { animation-delay: 1.5s; }
.mk-x-ripple i:nth-child(4) { animation-delay: 2.25s; }
.mk-x-ripple b { width: 16px; height: 16px; border-radius: 50%; background: var(--mk-accent, #2F5BFF); }
@keyframes mk-x-ripple { 0% { transform: scale(.15); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
</style>
</head>
<body>
<div class="mk-x-ripple"><i></i><i></i><i></i><i></i><b></b></div>
</body>
</html>
