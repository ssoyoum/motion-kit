<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테두리 그리기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 테두리 그리기 · 0.4s · 네 변이 모서리에서 뻗음 · 마우스를 올려 보세요 */
.mk-hb-border {
  padding: 10px 22px; border: 0; border-radius: 0; cursor: pointer;
  color: var(--mk-ink, #1B1E26); font: 700 14px system-ui, sans-serif;
  background:
    linear-gradient(var(--mk-accent, #2F5BFF), var(--mk-accent, #2F5BFF)) 0 0 / 0 2px no-repeat,
    linear-gradient(var(--mk-accent, #2F5BFF), var(--mk-accent, #2F5BFF)) 100% 0 / 2px 0 no-repeat,
    linear-gradient(var(--mk-accent, #2F5BFF), var(--mk-accent, #2F5BFF)) 100% 100% / 0 2px no-repeat,
    linear-gradient(var(--mk-accent, #2F5BFF), var(--mk-accent, #2F5BFF)) 0 100% / 2px 0 no-repeat;
  box-shadow: inset 0 0 0 1px var(--mk-line, #DCE0EA);
  transition: background-size .4s cubic-bezier(.6, 0, .2, 1), color .4s;
}
.mk-hb-border:hover, .mk-hb-border:focus-visible { background-size: 100% 2px, 2px 100%, 100% 2px, 2px 100%; color: var(--mk-accent, #2F5BFF); }
</style>
</head>
<body>
<button class="mk-hb-border" type="button">신청하기</button>
</body>
</html>
