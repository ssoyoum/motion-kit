<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빛줄기 회전</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 빛줄기 회전 · 12s · linear · 20° 반복 */
.mk-bg-rays { position: relative; width: 180px; height: 110px; border-radius: 12px; overflow: hidden; background: var(--mk-warn, #D99A00); }
.mk-bg-rays::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px 0 0 -150px;
  background: repeating-conic-gradient(rgb(255 255 255 / .28) 0 10deg, transparent 10deg 20deg);
  animation: mk-bg-rays 12s linear infinite;
}
.mk-bg-rays span {
  position: relative; display: grid; place-items: center; height: 100%;
  font: 900 22px system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 rgb(0 0 0 / .2);
}
@keyframes mk-bg-rays { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="mk-bg-rays"><span>당첨!</span></div>
</body>
</html>
