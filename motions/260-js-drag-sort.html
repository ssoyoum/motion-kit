<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끌어서 순서 바꾸기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 끌어서 순서 바꾸기 · pointer 이벤트 · 중간선 넘으면 자리 교환 · 끌어서 옮겨 보세요 */
.mk-js-drag-sort { list-style: none; margin: 0; padding: 0; width: 180px; display: grid; gap: 6px; }
.mk-js-drag-sort li {
  position: relative; display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px;
  background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); color: var(--mk-ink, #1B1E26);
  font-size: 12.5px; cursor: grab; user-select: none; touch-action: none;
}
.mk-js-drag-sort li .h { color: var(--mk-ink-soft, #8A90A0); letter-spacing: -2px; }
.mk-js-drag-sort li.drag { z-index: 2; cursor: grabbing; box-shadow: 0 8px 18px rgb(0 0 0 / .18); border-color: var(--mk-accent, #2F5BFF); }
</style>
</head>
<body>
<ul class="mk-js-drag-sort">
  <li><span class="h">⋮⋮</span>결제 확인</li>
  <li><span class="h">⋮⋮</span>포장</li>
  <li><span class="h">⋮⋮</span>출고</li>
  <li><span class="h">⋮⋮</span>배송 완료</li>
</ul>
<script>
document.querySelectorAll(".mk-js-drag-sort").forEach(function (root) {
var drag = null, startY = 0;
function center(el) { var r = el.getBoundingClientRect(); return r.top + r.height / 2; }
root.addEventListener("pointerdown", function (e) {
  var li = e.target.closest("li");
  if (!li) return;
  drag = li; startY = e.clientY;
  li.classList.add("drag");
  li.setPointerCapture(e.pointerId);
});
root.addEventListener("pointermove", function (e) {
  if (!drag) return;
  drag.style.transform = "translateY(" + (e.clientY - startY) + "px)";
  var mid = center(drag), next = drag.nextElementSibling, prev = drag.previousElementSibling;
  if (next && mid > center(next)) {
    startY += next.offsetHeight + 6; root.insertBefore(next, drag);
  } else if (prev && mid < center(prev)) {
    startY -= prev.offsetHeight + 6; root.insertBefore(drag, prev);
  } else return;
  drag.style.transform = "translateY(" + (e.clientY - startY) + "px)";
});
function end() {
  if (!drag) return;
  drag.classList.remove("drag"); drag.style.transform = ""; drag = null;
}
root.addEventListener("pointerup", end);
root.addEventListener("pointercancel", end);
});
</script>
</body>
</html>
