<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어 돌리기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 단어 돌리기 · 4.5s · 단어 3개 + 처음 단어 복제 */
.mk-rotw { margin: 0; display: flex; gap: .3em; font: 700 18px system-ui, sans-serif; }
.mk-rotw span { display: inline-block; height: 1.3em; overflow: hidden; }
.mk-rotw b { display: block; line-height: 1.3em; color: var(--mk-accent, #2F5BFF); animation: mk-rotw 4.5s cubic-bezier(.7, 0, .3, 1) infinite; }
@keyframes mk-rotw {
  0%, 28% { transform: none; }
  33%, 61% { transform: translateY(-100%); }
  66%, 94% { transform: translateY(-200%); }
  100% { transform: translateY(-300%); }
}
</style>
</head>
<body>
<p class="mk-rotw">상담은 <span><b>빠르게</b><b>정확하게</b><b>친절하게</b><b aria-hidden="true">빠르게</b></span></p>
</body>
</html>
