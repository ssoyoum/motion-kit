<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파이 차트 채우기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 파이 차트 채우기 · 3s · @property 0→100 */
@property --mk-ch-pie-p { syntax: "<number>"; initial-value: 0; inherits: true; }
.mk-ch-pie { display: flex; align-items: center; gap: 14px; animation: mk-ch-pie 3s cubic-bezier(.4, 0, .2, 1) infinite; }
.mk-ch-pie i {
  width: 76px; height: 76px; border-radius: 50%;
  background: conic-gradient(
    var(--mk-accent, #2F5BFF) 0 calc(min(var(--mk-ch-pie-p), 45) * 1%),
    var(--mk-success, #1F9D55) 0 calc(min(var(--mk-ch-pie-p), 75) * 1%),
    var(--mk-warn, #D99A00) 0 calc(var(--mk-ch-pie-p) * 1%),
    var(--mk-skel-a, #E0E4EC) 0);
}
.mk-ch-pie ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font: 500 12px system-ui, sans-serif; }
.mk-ch-pie li::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; background: var(--mk-accent, #2F5BFF); }
.mk-ch-pie li:nth-child(2)::before { background: var(--mk-success, #1F9D55); }
.mk-ch-pie li:nth-child(3)::before { background: var(--mk-warn, #D99A00); }
@keyframes mk-ch-pie { 0% { --mk-ch-pie-p: 0; } 60%, 100% { --mk-ch-pie-p: 100; } }
</style>
</head>
<body>
<div class="mk-ch-pie"><i></i><ul><li>과일 45%</li><li>수산 30%</li><li>채소 25%</li></ul></div>
</body>
</html>
