<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바깥으로 퍼지는 테두리</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 바깥으로 퍼지는 테두리 · 1s · 테두리가 밖으로 퍼지며 사라짐 · 마우스를 올려 보세요 */
.mk-hv-ripple-out { position: relative; padding: 10px 20px; border: 0; border-radius: 8px; cursor: pointer; background: var(--mk-surface, #fff); color: var(--mk-ink, #1B1E26); font: 700 14px system-ui, sans-serif; box-shadow: inset 0 0 0 1px var(--mk-line, #DCE0EA); }
.mk-hv-ripple-out::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--mk-accent, #2F5BFF); border-radius: inherit; opacity: 0; pointer-events: none; }
.mk-hv-ripple-out:hover::before, .mk-hv-ripple-out:focus-visible::before { animation: mk-hv-ripple-out 1s ease-out infinite; }
@keyframes mk-hv-ripple-out { from { inset: 0; opacity: 1; } to { inset: -12px; opacity: 0; } }
</style>
</head>
<body>
<button class="mk-hv-ripple-out" type="button">메뉴 보기</button>
</body>
</html>
