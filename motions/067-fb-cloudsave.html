<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클라우드 저장</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 클라우드 저장 · 3s · 올라가는 화살표 → 체크 */
.mk-fb-cloudsave { width: 56px; height: 56px; fill: none; stroke: var(--mk-accent, #2F5BFF); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mk-fb-cloudsave-up { animation: mk-fb-cloudsave-u 3s infinite; }
.mk-fb-cloudsave-ok { stroke: var(--mk-success, #1F9D55); stroke-width: 2; stroke-dasharray: 8; stroke-dashoffset: 8; animation: mk-fb-cloudsave-c 3s infinite; }
@keyframes mk-fb-cloudsave-u {
  0% { transform: translateY(2px); opacity: 0; }
  10%, 40% { transform: none; opacity: 1; }
  50%, 100% { transform: translateY(-2px); opacity: 0; }
}
@keyframes mk-fb-cloudsave-c { 0%, 50% { stroke-dashoffset: 8; opacity: 1; } 65%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
</head>
<body>
<svg class="mk-fb-cloudsave" viewBox="0 0 24 24" aria-label="저장됨"><path d="M7 19h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.6 4.7 4.7 0 0 0 7 19z"/><path class="mk-fb-cloudsave-up" d="M12 16v-5M9.8 13L12 10.8 14.2 13"/><path class="mk-fb-cloudsave-ok" d="M9.4 14.2l1.9 1.9 3.4-3.6"/></svg>
</body>
</html>
