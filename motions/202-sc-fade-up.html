<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아래서 떠오르기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 아래서 떠오르기 · view() · entry 0→100% · 안에서 스크롤해 보세요 */
.mk-sc-fade-up { width: 200px; height: 130px; overflow: hidden auto; padding: 0 10px; border-radius: 12px; background: var(--mk-surface, #fff); border: 1px solid var(--mk-line, #DCE0EA); scrollbar-width: thin; }
.mk-sc-fade-up > p { height: 104px; margin: 0; display: grid; place-items: center; font: 600 11px system-ui, sans-serif; color: var(--mk-ink-soft, #8A90A0); }
.mk-sc-fade-up i { display: block; margin: 0 0 10px; padding: 12px; border-radius: 8px; background: var(--mk-accent, #2F5BFF); color: var(--mk-on-accent, #fff); font: 700 12px system-ui, sans-serif; font-style: normal; }
@supports (animation-timeline: view()) {
  .mk-sc-fade-up i { animation: mk-sc-fade-up linear both; animation-timeline: view(); animation-range: entry 0% entry 100%; }
}
@keyframes mk-sc-fade-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="mk-sc-fade-up"><p>↓ 안에서 스크롤해 보세요</p><i>새 소식</i><i>이번 주 특가</i><i>추천 상품</i><i>후기 모음</i><i>이벤트</i></div>
</body>
</html>
