<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장바구니 담기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 장바구니 담기 · 4s · 물건 3개 0.6s씩 떨어짐 */
.mk-il-cart { width: 190px; height: 105px; overflow: visible; }
.mk-il-cart .cart { animation: mk-il-cart-bump 4s ease-out infinite; }
.mk-il-cart .cart path { fill: none; stroke: var(--mk-ink, #1B1E26); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.mk-il-cart .cart circle { fill: var(--mk-ink, #1B1E26); }
.mk-il-cart .items > * { animation: mk-il-cart-drop 4s cubic-bezier(.5, 0, .6, 1.4) infinite; }
.mk-il-cart .items > :nth-child(1) { fill: var(--mk-accent, #2F5BFF); }
.mk-il-cart .items > :nth-child(2) { fill: var(--mk-warn, #D99A00); animation-delay: .6s; }
.mk-il-cart .items > :nth-child(3) { fill: var(--mk-success, #1F9D55); animation-delay: 1.2s; }
@keyframes mk-il-cart-drop { 0% { transform: translateY(-60px); opacity: 0; } 5% { opacity: 1; } 15%, 80% { transform: none; opacity: 1; } 92%, 100% { transform: none; opacity: 0; } }
@keyframes mk-il-cart-bump { 0%, 13%, 19%, 28%, 34%, 43%, 49%, 100% { transform: none; } 16%, 31%, 46% { transform: translateY(2px); } }
</style>
</head>
<body>
<svg class="mk-il-cart" viewBox="0 0 200 110">
  <g class="items"><rect x="74" y="44" width="16" height="16" rx="3"/><rect x="94" y="40" width="14" height="20" rx="3"/><circle cx="120" cy="52" r="8"/></g>
  <g class="cart"><path d="M36 26h14l12 44h64l10-28H58"/><circle cx="70" cy="84" r="6"/><circle cx="118" cy="84" r="6"/></g>
</svg>
</body>
</html>
