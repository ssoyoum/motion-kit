<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세로 마키</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 세로 마키 · 7s · linear · ∞ · 위아래 페이드 */
.mk-x-vmarq { width: 150px; height: 110px; overflow: hidden; -webkit-mask: linear-gradient(transparent, #000 20%, #000 80%, transparent); mask: linear-gradient(transparent, #000 20%, #000 80%, transparent); }
.mk-x-vmarq div { display: grid; gap: 8px; animation: mk-x-vmarq 7s linear infinite; }
.mk-x-vmarq i { display: block; padding: 8px 12px; border-radius: 8px; background: var(--mk-skel-a, #E0E4EC); color: var(--mk-ink, #1B1E26); font: 600 12px system-ui, sans-serif; font-style: normal; }
@keyframes mk-x-vmarq { to { transform: translateY(calc(-50% - 4px)); } }
</style>
</head>
<body>
<div class="mk-x-vmarq"><div><i>새 기능 출시</i><i>점검 안내</i><i>이벤트 시작</i><i>후기 1,000개</i><i>새 기능 출시</i><i>점검 안내</i><i>이벤트 시작</i><i>후기 1,000개</i></div></div>
</body>
</html>
