<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도넛 채우기</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 도넛 채우기 · 3s · @property 0→72% */
@property --mk-d { syntax: "<integer>"; initial-value: 0; inherits: true; }
.mk-donut {
  position: relative; width: 72px; height: 72px; display: grid; place-items: center;
  font: 700 15px system-ui, sans-serif; font-variant-numeric: tabular-nums;
  counter-reset: d var(--mk-d); animation: mk-donut 3s cubic-bezier(.4, 0, .2, 1) infinite;
}
.mk-donut i {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--mk-accent, #2F5BFF) calc(var(--mk-d) * 1%), var(--mk-skel-a, #E0E4EC) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent 70%, #000 71%);
  mask: radial-gradient(farthest-side, transparent 70%, #000 71%);
}
.mk-donut span::after { content: counter(d) "%"; }
@keyframes mk-donut { 0% { --mk-d: 0; } 60%, 100% { --mk-d: 72; } }
</style>
</head>
<body>
<div class="mk-donut"><i></i><span></span></div>
</body>
</html>
