<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>택배 상자 열림</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 택배 상자 열림 · 3.2s · 날개 150° 열림 → 물건 솟음 */
.mk-il-box { width: 190px; height: 105px; overflow: visible; }
.mk-il-box .bd { fill: var(--mk-warn, #D99A00); }
.mk-il-box .flap { fill: color-mix(in srgb, var(--mk-warn, #D99A00) 78%, #000); transform-box: fill-box; animation: 3.2s cubic-bezier(.5, 0, .3, 1.3) infinite; }
.mk-il-box .flap.l { transform-origin: left center; animation-name: mk-il-box-l; }
.mk-il-box .flap.r { transform-origin: right center; animation-name: mk-il-box-r; }
.mk-il-box .tape { fill: var(--mk-surface, #fff); opacity: .45; }
.mk-il-box .item { fill: var(--mk-accent, #2F5BFF); animation: mk-il-box-item 3.2s cubic-bezier(.3, 1.4, .5, 1) infinite; }
@keyframes mk-il-box-l { 0%, 20%, 90%, 100% { transform: none; } 35%, 75% { transform: rotate(-150deg); } }
@keyframes mk-il-box-r { 0%, 20%, 90%, 100% { transform: none; } 35%, 75% { transform: rotate(150deg); } }
@keyframes mk-il-box-item { 0%, 30% { transform: none; } 45%, 70% { transform: translateY(-48px); } 85%, 100% { transform: none; } }
</style>
</head>
<body>
<svg class="mk-il-box" viewBox="0 0 200 110">
  <circle class="item" cx="100" cy="66" r="12"/>
  <rect class="flap l" x="52" y="40" width="48" height="8" rx="2"/>
  <rect class="flap r" x="100" y="40" width="48" height="8" rx="2"/>
  <rect class="bd" x="52" y="46" width="96" height="56" rx="4"/>
  <rect class="tape" x="92" y="46" width="16" height="56"/>
</svg>
</body>
</html>
