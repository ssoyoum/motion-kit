<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오로라</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 오로라 · 6s · blur 22px 원 3개 */
.mk-aurora { position: relative; overflow: hidden; width: 180px; height: 110px; border-radius: 12px; background: var(--mk-ink, #1B1E26); }
.mk-aurora i { position: absolute; width: 90px; height: 90px; border-radius: 50%; filter: blur(22px); opacity: .8; animation: mk-aurora 6s ease-in-out infinite alternate; }
.mk-aurora i:nth-child(1) { left: -10px; top: -10px; background: var(--mk-accent, #2F5BFF); }
.mk-aurora i:nth-child(2) { right: -10px; top: 10px; background: var(--mk-success, #1F9D55); animation-delay: -2s; }
.mk-aurora i:nth-child(3) { left: 50px; bottom: -30px; background: var(--mk-danger, #E5484D); animation-delay: -4s; }
@keyframes mk-aurora { to { transform: translate(30px, 20px) scale(1.2); } }
</style>
</head>
<body>
<div class="mk-aurora"><i></i><i></i><i></i></div>
</body>
</html>
