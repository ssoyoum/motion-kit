<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 시 헤더 축소</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 스크롤 시 헤더 축소 · 4s · 높이 40→26px + 그림자 */
.mk-n-header { position: relative; width: 150px; height: 120px; overflow: hidden; border-radius: 12px; border: 1px solid var(--mk-line, #DCE0EA); background: var(--mk-surface, #fff); }
.mk-n-header header {
  position: absolute; inset: 0 0 auto; z-index: 1; height: 40px; display: flex; align-items: center; padding: 0 10px;
  background: var(--mk-surface, #fff); font: 800 16px system-ui, sans-serif;
  animation: mk-n-header 4s ease-in-out infinite;
}
.mk-n-header > div { display: grid; gap: 6px; padding: 46px 10px 0; animation: mk-n-header-s 4s ease-in-out infinite; }
.mk-n-header i { height: 14px; border-radius: 4px; background: var(--mk-skel-a, #E0E4EC); }
@keyframes mk-n-header {
  0%, 20%, 100% { height: 40px; font-size: 16px; box-shadow: none; }
  45%, 75% { height: 26px; font-size: 12px; box-shadow: 0 4px 10px rgb(0 0 0 / .1); }
}
@keyframes mk-n-header-s { 0%, 20%, 100% { transform: none; } 45%, 75% { transform: translateY(-40px); } }
</style>
</head>
<body>
<div class="mk-n-header"><header>교동마을</header><div><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
</body>
</html>
