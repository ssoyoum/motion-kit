<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배터리 충전</title>
<style>
/* 색은 아래 변수만 바꾸면 됩니다 */
:root { --mk-accent:#2F5BFF;--mk-on-accent:#fff;--mk-ink:#1B1E26;--mk-on-ink:#fff;--mk-ink-soft:#8A90A0;--mk-bubble:#E3E7F0;--mk-danger:#E5484D;--mk-success:#1F9D55;--mk-skel-a:#E0E4EC;--mk-skel-b:#F4F5F8;--mk-warn:#D99A00;--mk-surface:#fff;--mk-line:#DCE0EA;--mk-stage:#ECEEF4; }
@media (prefers-color-scheme: dark) { :root { --mk-accent:#7B96FF;--mk-on-accent:#0E1015;--mk-ink:#E8EAF0;--mk-on-ink:#11131A;--mk-ink-soft:#8C93A5;--mk-bubble:#2A2F3D;--mk-danger:#FF6B70;--mk-success:#3DD68C;--mk-skel-a:#242938;--mk-skel-b:#313849;--mk-warn:#F5C04A;--mk-surface:#161922;--mk-line:#2A2F3C;--mk-stage:#1D212C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mk-stage); color: var(--mk-ink); font-family: system-ui, sans-serif; }

/* 배터리 충전 · 2.4s · steps(5, jump-none) */
.mk-batt { position: relative; width: 56px; height: 28px; padding: 3px; border: 3px solid var(--mk-ink, #1B1E26); border-radius: 6px; box-sizing: border-box; }
.mk-batt::after { content: ""; position: absolute; right: -8px; top: 6px; width: 4px; height: 10px; border-radius: 0 2px 2px 0; background: var(--mk-ink, #1B1E26); }
.mk-batt i { display: block; height: 100%; border-radius: 2px; background: var(--mk-success, #1F9D55); animation: mk-batt 2.4s steps(5, jump-none) infinite; }
@keyframes mk-batt { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>
<div class="mk-batt"><i></i></div>
</body>
</html>
